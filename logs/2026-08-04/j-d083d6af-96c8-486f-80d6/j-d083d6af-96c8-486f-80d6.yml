    # ---------------------------------------------------------
    # CHECK: the cross-stack evidence gate
    # ---------------------------------------------------------
    - name: check
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
              - name: gpc-check
                image: vllm/vllm-tpu:nightly
                imagePullPolicy: Always
                env:
                  - name: JS_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
                  - name: MODEL
                    value: "Qwen3.5-35B-A3B-FP8"
                  - name: PROXY_PORT
                    value: "10000"
                  - name: GPC_DOCS
                    value: "48"
                  - name: GPC_PROMPT_TOKENS
                    value: "32832"
                  - name: PUBLISH_WAIT_S
                    value: "15"
                command: ["/bin/bash", "-c"]
                args:
                  - |
                    set -eo pipefail
                    : "${CDK_OUTPUT_DIR:=/tmp/cdk-outputs}"
                    export CDK_OUTPUT_DIR
                    mkdir -p "$CDK_OUTPUT_DIR"
                    export PYTHONUNBUFFERED=1

                    PA="${JS_NAME}-prefill-a-0-0.${JS_NAME}"
                    PB="${JS_NAME}-prefill-b-0-0.${JS_NAME}"
                    DA="${JS_NAME}-decode-a-0-0.${JS_NAME}"
                    DB="${JS_NAME}-decode-b-0-0.${JS_NAME}"
                    PROXY_A="http://${PA}:${PROXY_PORT}"
                    PROXY_B="http://${PB}:${PROXY_PORT}"

                    wait_for() {
                      local name="$1" url="$2" timeout="$3" elapsed=0 interval=5
                      echo "Waiting for $name up ($url, up to ${timeout}s)"
                      until curl -sf "$url" > /dev/null; do
                        if [ "$elapsed" -ge "$timeout" ]; then
                          echo "RESULT: FAIL ($name did not become healthy within ${timeout}s)" >&2
                          exit 1
                        fi
                        sleep "$interval"; elapsed=$((elapsed + interval))
                      done
                      echo "$name is up (${elapsed}s)"
                    }

                    wait_for prefill-a "http://$PA:8000/health" $((90 * 60))
                    wait_for decode-a  "http://$DA:7200/health" $((90 * 60))
                    wait_for proxy-a   "$PROXY_A/healthcheck"   $((10 * 60))
                    wait_for prefill-b "http://$PB:8000/health" $((90 * 60))
                    wait_for decode-b  "http://$DB:7200/health" $((90 * 60))
                    wait_for proxy-b   "$PROXY_B/healthcheck"   $((10 * 60))

                    # Engine readiness doubles as the registration-gate
                    # warm-up on all four stores (the first request through
                    # each proxy triggers deferred worker registration).
                    for leg in A B; do
                      PROXY_VAR="PROXY_$leg"; PROXY="${!PROXY_VAR}"
                      echo "Waiting for stack-$leg engine readiness (first compile, up to 60 min)..."
                      max_wait=$((60 * 60)); waited=0
                      until curl -sf --max-time 300 -X POST "$PROXY/v1/completions" \
                          -H "Content-Type: application/json" \
                          -d "{\"model\": \"$MODEL\", \"prompt\": \"Hello\", \"max_tokens\": 5}" > /dev/null; do
                        if [ "$waited" -ge "$max_wait" ]; then
                          echo "RESULT: FAIL (stack-$leg engine not ready within 60 minutes)"; exit 1
                        fi
                        echo "stack-$leg compiling, waiting 30s..."; sleep 30; waited=$((waited + 30))
                      done
                      echo "stack-$leg engines are ready."
                    done
                    sleep 5

                    python3 - "$PROXY_A" "$PROXY_B" "http://$PB:8000" "http://$PA:8000" \
                        "$MODEL" <<'GPC_EOF'
                    import json
                    import os
                    import re
                    import sys
                    import time
                    import urllib.request

                    proxy_a, proxy_b, prefill_b, prefill_a, model = sys.argv[1:]
                    DOCS = int(os.environ.get("GPC_DOCS", "48"))
                    PLEN = int(os.environ.get("GPC_PROMPT_TOKENS", "32832"))
                    PUBLISH_WAIT_S = float(os.environ.get("PUBLISH_WAIT_S", "15"))

                    KEYS = dict(ttft_s="time_to_first_token_seconds_sum",
                                ttft_n="time_to_first_token_seconds_count",
                                pre_s="request_prefill_time_seconds_sum",
                                pre_n="request_prefill_time_seconds_count",
                                hit="external_prefix_cache_hits_total",
                                q="external_prefix_cache_queries_total")

                    def scrape(base):
                        with urllib.request.urlopen(f"{base}/metrics",
                                                    timeout=30) as r:
                            text = r.read().decode()
                        m = {}
                        for line in text.splitlines():
                            if line.startswith("#"):
                                continue
                            mo = re.match(
                                r"vllm:([a-z_0-9]+)\{.*\} ([0-9.e+-]+)$", line)
                            if mo:
                                m[mo.group(1)] = (m.get(mo.group(1), 0.0)
                                                  + float(mo.group(2)))
                        return m

                    def ask(base, prompt, max_tokens):
                        payload = {
                            "model": model, "prompt": prompt,
                            "max_tokens": max_tokens, "temperature": 0.0,
                            "seed": 0, "ignore_eos": True,
                            "add_special_tokens": False,
                            "return_token_ids": True,
                        }
                        req = urllib.request.Request(
                            base + "/v1/completions",
                            data=json.dumps(payload).encode(),
                            headers={"Content-Type": "application/json"})
                        with urllib.request.urlopen(req, timeout=900) as r:
                            return json.loads(r.read())["choices"][0].get(
                                "token_ids")

                    # Serial requests on quiet engines: a per-request metrics
                    # delta on stack B's prefill is exactly that request.
                    def measured(base_proxy, prompt):
                        before = scrape(prefill_b)
                        ask(base_proxy, prompt, 1)
                        after = scrape(prefill_b)
                        d = {k: after.get(v, 0) - before.get(v, 0)
                             for k, v in KEYS.items()}
                        return {"ttft": d["ttft_s"] / (d["ttft_n"] or 1),
                                "prefill": d["pre_s"] / (d["pre_n"] or 1),
                                "hit": d["hit"], "q": d["q"]}

                    failures = []

                    # ---- stage 1: cross-stack known-answer equivalence ----
                    # A greedy KA probe cold through stack A, replayed
                    # through stack B. B's output must byte-match (greedy KA
                    # probes are byte-stable on this stack — same gate the
                    # single-stack disagg recipes use) and B's prefill must
                    # have served it externally. The prompt must EXCEED one
                    # 32768-token hash block: vLLM caps prefix hits at
                    # num_tokens - 1, so an exactly-one-chunk prompt can
                    # never claim its own chunk and the offload lookup
                    # short-circuits before the registry (j-4b344fc6: KA at
                    # 32768 recomputed with 0 hits while the 32832-token
                    # docs all hit 32768/32831). The doubled wait covers the
                    # one-time cost of stack A's very first save+publish.
                    print("=== stage 1: cross-stack KA (32832 tokens) ===")
                    ka_a = ask(proxy_a, [89] * 32832, 8)
                    time.sleep(2 * PUBLISH_WAIT_S)
                    before = scrape(prefill_b)
                    ka_b = ask(proxy_b, [89] * 32832, 8)
                    delta = scrape(prefill_b)
                    ka_hits = delta.get(KEYS["hit"], 0) - before.get(
                        KEYS["hit"], 0)
                    print(f"ka: A={ka_a} B={ka_b} b_prefill_ext_hits={ka_hits}")
                    if not ka_a or ka_a != ka_b:
                        failures.append(
                            f"cross-stack KA mismatch: A={ka_a} B={ka_b}")
                    if ka_hits <= 0:
                        failures.append(
                            "cross-stack KA replay produced no external hits "
                            "on stack B's prefill — it recomputed instead of "
                            "pulling from the shared cache")

                    # ---- stage 2: cross-restore A/B ----
                    # Seed docs through stack A; revisit them through stack
                    # B (must be served by the shared cache); fresh docs
                    # through stack B (cold baseline, must NOT hit).
                    print(f"=== stage 2: seeding {DOCS} docs via stack A ===")
                    for doc in range(DOCS):
                        ask(proxy_a, [500 + doc] * PLEN, 1)
                    print(f"waiting {PUBLISH_WAIT_S:.0f}s for saves to "
                          "commit and publish")
                    time.sleep(PUBLISH_WAIT_S)

                    def run_pass(tag, base_token):
                        rows = []
                        for doc in range(DOCS):
                            r = measured(proxy_b, [base_token + doc] * PLEN)
                            print(f"[{tag}] doc{doc} ttft={r['ttft']:.3f}s "
                                  f"prefill={r['prefill']:.3f}s "
                                  f"ext_hit={int(r['hit'])}/{int(r['q'])}",
                                  flush=True)
                            rows.append(r)
                        n = max(len(rows), 1)
                        med = sorted(x["ttft"] for x in rows)[n // 2]
                        pre = sum(x["prefill"] for x in rows) / n
                        hits = sum(x["hit"] for x in rows)
                        qs = sum(x["q"] for x in rows) or 1
                        pct = 100 * hits / qs
                        print(f"[{tag}:summary] reqs={n} ttft_p50={med:.3f}s "
                              f"prefill_avg={pre:.3f}s ext_hit_pct={pct:.1f}")
                        return med, pre, pct

                    print(f"=== cross-revisit: same {DOCS} docs via stack B ===")
                    rev_ttft, rev_pre, rev_hit = run_pass("xrevisit", 500)
                    print(f"=== cold baseline: {DOCS} fresh docs via stack B ===")
                    cold_ttft, cold_pre, cold_hit = run_pass("cold", 600)

                    print(f"[gpc:ab] revisit_prefill_avg={rev_pre:.3f}s "
                          f"cold_prefill_avg={cold_pre:.3f}s "
                          f"ttft_p50_ratio={rev_ttft/max(cold_ttft,1e-9):.2f}")

                    if cold_hit > 5:
                        failures.append(
                            f"cold pass ext_hit_pct={cold_hit:.1f}: fresh "
                            "docs are not cold, the A/B is invalid")
                    if rev_hit < 90:
                        failures.append(
                            f"cross-revisit ext_hit_pct={rev_hit:.1f} < 90: "
                            "stack B did not serve stack A's docs from the "
                            "shared cache")

                    if failures:
                        print("RESULT: FAIL (" + "; ".join(failures) + ")")
                        sys.exit(1)
                    print(f"RESULT: PASS (cross-stack KA equivalent with "
                          f"{int(ka_hits)} external hits; cross-revisit "
                          f"ext_hit_pct={rev_hit:.1f} vs cold "
                          f"{cold_hit:.1f}; prefill {rev_pre:.3f}s vs "
                          f"{cold_pre:.3f}s cold)")
                    GPC_EOF
                resources:
                  limits:
                    memory: "16Gi"
                    cpu: "4"
                  requests:
                    memory: "8Gi"
                    cpu: "2"
