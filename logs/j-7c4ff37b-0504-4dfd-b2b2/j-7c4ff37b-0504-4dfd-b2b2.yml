    # ---------------------------------------------------------
    # CHECK: the cross-stack evidence gate
    # ---------------------------------------------------------
    - name: check
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
              - name: gpc-check
                image: vllm/vllm-tpu:nightly
                imagePullPolicy: Always
                env:
                  - name: JS_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
                  - name: MODEL
                    value: "Qwen3.5-35B-A3B-FP8"
                  - name: PROXY_PORT
                    value: "10000"
                  - name: GPC_DOCS
                    value: "48"
                  - name: GPC_PROMPT_TOKENS
                    value: "32832"
                  - name: PUBLISH_WAIT_S
                    value: "15"
                command: ["/bin/bash", "-c"]
                args:
                  - |
                    set -eo pipefail
                    : "${CDK_OUTPUT_DIR:=/tmp/cdk-outputs}"
                    export CDK_OUTPUT_DIR
                    mkdir -p "$CDK_OUTPUT_DIR"
                    export PYTHONUNBUFFERED=1

                    PA="${JS_NAME}-prefill-a-0-0.${JS_NAME}"
                    PB="${JS_NAME}-prefill-b-0-0.${JS_NAME}"
                    DA="${JS_NAME}-decode-a-0-0.${JS_NAME}"
                    DB="${JS_NAME}-decode-b-0-0.${JS_NAME}"
                    PROXY_A="http://${PA}:${PROXY_PORT}"
                    PROXY_B="http://${PB}:${PROXY_PORT}"

                    wait_for() {
                      local name="$1" url="$2" timeout="$3" elapsed=0 interval=5
                      echo "Waiting for $name up ($url, up to ${timeout}s)"
                      until curl -sf "$url" > /dev/null; do
                        if [ "$elapsed" -ge "$timeout" ]; then
                          echo "RESULT: FAIL ($name did not become healthy within ${timeout}s)" >&2
                          exit 1
                        fi
                        sleep "$interval"; elapsed=$((elapsed + interval))
                      done
                      echo "$name is up (${elapsed}s)"
                    }

                    wait_for prefill-a "http://$PA:8000/health" $((90 * 60))
                    wait_for decode-a  "http://$DA:7200/health" $((90 * 60))
                    wait_for proxy-a   "$PROXY_A/healthcheck"   $((10 * 60))
                    wait_for prefill-b "http://$PB:8000/health" $((90 * 60))
                    wait_for decode-b  "http://$DB:7200/health" $((90 * 60))
                    wait_for proxy-b   "$PROXY_B/healthcheck"   $((10 * 60))

                    # Engine readiness doubles as the registration-gate
                    # warm-up on all four stores (the first request through
                    # each proxy triggers deferred worker registration).
                    for leg in A B; do
                      PROXY_VAR="PROXY_$leg"; PROXY="${!PROXY_VAR}"
                      echo "Waiting for stack-$leg engine readiness (first compile, up to 60 min)..."
                      # Wall-clock deadline: a hung curl consumes up to
                      # its --max-time on top of the sleep, so counting
                      # sleeps alone could stretch far past 60 minutes.
                      deadline=$((SECONDS + 60 * 60))
                      until curl -sf --max-time 300 -X POST "$PROXY/v1/completions" \
                          -H "Content-Type: application/json" \
                          -d "{\"model\": \"$MODEL\", \"prompt\": \"Hello\", \"max_tokens\": 5}" > /dev/null; do
                        if [ "$SECONDS" -ge "$deadline" ]; then
                          echo "RESULT: FAIL (stack-$leg engine not ready within 60 minutes)"; exit 1
                        fi
                        echo "stack-$leg compiling, waiting 30s..."; sleep 30
                      done
                      echo "stack-$leg engines are ready."
                    done
                    sleep 5

                    python3 - "$PROXY_A" "$PROXY_B" "http://$PB:8000" "http://$PA:8000" \
                        "$MODEL" <<'GPC_EOF'
                    import json
                    import os
                    import re
                    import sys
                    import time
                    import urllib.request

                    proxy_a, proxy_b, prefill_b, prefill_a, model = sys.argv[1:]
                    DOCS = int(os.environ.get("GPC_DOCS", "48"))
                    PLEN = int(os.environ.get("GPC_PROMPT_TOKENS", "32832"))
                    PUBLISH_WAIT_S = float(os.environ.get("PUBLISH_WAIT_S", "15"))

                    # Everything the gates key off is derived here, so
                    # retuning PLEN or the block cannot leave a stale
                    # threshold behind. HASH_BLOCK is block_size * pcp:
                    # one PCP8 stripe set is what the registry publishes.
                    BLOCK = int(os.environ.get("GPC_BLOCK_SIZE", "2304"))
                    PCP = int(os.environ.get("GPC_PCP", "8"))
                    HASH_BLOCK = BLOCK * PCP
                    # vLLM caps prefix hits at num_tokens - 1: a request can
                    # never claim its own last token, so 32832 scores 32831.
                    SCORED = PLEN - 1
                    EXPECT_HITS = (SCORED // HASH_BLOCK) * HASH_BLOCK
                    EXPECT_PCT = 100.0 * EXPECT_HITS / SCORED
                    TAIL = SCORED - EXPECT_HITS
                    # Band, not equality: the counter is deterministic in
                    # practice but a hard == would fail the run on a single
                    # scrape landing mid-request. +-4 pts still separates
                    # "one block restored" from zero blocks or two.
                    HIT_BAND = float(os.environ.get("GPC_HIT_BAND", "4"))

                    KEYS = dict(ttft_s="time_to_first_token_seconds_sum",
                                ttft_n="time_to_first_token_seconds_count",
                                pre_s="request_prefill_time_seconds_sum",
                                pre_n="request_prefill_time_seconds_count",
                                hit="external_prefix_cache_hits_total",
                                q="external_prefix_cache_queries_total")

                    def scrape(base):
                        with urllib.request.urlopen(f"{base}/metrics",
                                                    timeout=30) as r:
                            text = r.read().decode()
                        m = {}
                        for line in text.splitlines():
                            if line.startswith("#"):
                                continue
                            mo = re.match(
                                r"vllm:([a-z_0-9]+)\{.*\} ([0-9.e+-]+)$", line)
                            if mo:
                                m[mo.group(1)] = (m.get(mo.group(1), 0.0)
                                                  + float(mo.group(2)))
                        return m

                    def ask(base, prompt, max_tokens):
                        payload = {
                            "model": model, "prompt": prompt,
                            "max_tokens": max_tokens, "temperature": 0.0,
                            "seed": 0, "ignore_eos": True,
                            "add_special_tokens": False,
                            "return_token_ids": True,
                        }
                        req = urllib.request.Request(
                            base + "/v1/completions",
                            data=json.dumps(payload).encode(),
                            headers={"Content-Type": "application/json"})
                        with urllib.request.urlopen(req, timeout=900) as r:
                            return json.loads(r.read())["choices"][0].get(
                                "token_ids")

                    # Serial requests on quiet engines: a per-request metrics
                    # delta on stack B's prefill is exactly that request.
                    def measured(base_proxy, prompt):
                        before = scrape(prefill_b)
                        ask(base_proxy, prompt, 1)
                        after = scrape(prefill_b)
                        d = {k: after.get(v, 0) - before.get(v, 0)
                             for k, v in KEYS.items()}
                        return {"ttft": d["ttft_s"] / (d["ttft_n"] or 1),
                                "prefill": d["pre_s"] / (d["pre_n"] or 1),
                                "hit": d["hit"], "q": d["q"]}

                    failures = []

                    # ---- stage 1: cross-stack known-answer probe ----
                    # A greedy KA probe cold through stack A, replayed
                    # through stack B. The hard gates are B's external
                    # prefix hits (proof the shared cache served it) and an
                    # early-divergence check: corrupt restored KV garbles
                    # output from the first tokens, while the stack's benign
                    # run-to-run nondeterminism flips at most a later token.
                    # Full token equality is printed as information only —
                    # never gate this stack on byte-identical outputs.
                    # The prompt must EXCEED one HASH_BLOCK: vLLM caps
                    # prefix hits at num_tokens - 1, so an exactly-one-chunk
                    # prompt can never claim its own chunk and the offload
                    # lookup short-circuits before the registry. At 32832
                    # over an 18432-token block there is a whole block to
                    # spare, so this is comfortable rather than marginal.
                    # The doubled wait covers stack A's very first
                    # save+publish.
                    print(f"=== geometry: block={BLOCK} pcp={PCP} "
                          f"hash_block={HASH_BLOCK} plen={PLEN} "
                          f"scored={SCORED} expect_hits={EXPECT_HITS} "
                          f"({EXPECT_PCT:.1f}%) recomputed_tail={TAIL} ===")
                    print(f"=== stage 1: cross-stack KA ({PLEN} tokens) ===")
                    ka_a = ask(proxy_a, [89] * PLEN, 8)
                    time.sleep(2 * PUBLISH_WAIT_S)
                    before = scrape(prefill_b)
                    ka_b = ask(proxy_b, [89] * PLEN, 8)
                    delta = scrape(prefill_b)
                    ka_hits = delta.get(KEYS["hit"], 0) - before.get(
                        KEYS["hit"], 0)
                    print(f"ka: A={ka_a} B={ka_b} "
                          f"identical={bool(ka_a) and ka_a == ka_b} "
                          f"b_prefill_ext_hits={ka_hits}")
                    if not ka_a or not ka_b or ka_a[:2] != ka_b[:2]:
                        failures.append(
                            "cross-stack KA diverged at the first tokens "
                            f"(corrupt served KV?): A={ka_a} B={ka_b}")
                    if ka_hits < EXPECT_HITS:
                        failures.append(
                            f"cross-stack KA replay scored {ka_hits} external "
                            f"hits, expected {EXPECT_HITS} (one whole "
                            f"{HASH_BLOCK}-token hash block) — stack B "
                            "recomputed part of what the shared cache "
                            "should have served")

                    # ---- stage 2: cross-restore A/B ----
                    # Seed docs through stack A; revisit them through stack
                    # B (must be served by the shared cache); fresh docs
                    # through stack B (cold baseline, must NOT hit).
                    print(f"=== stage 2: seeding {DOCS} docs via stack A ===")
                    for doc in range(DOCS):
                        ask(proxy_a, [500 + doc] * PLEN, 1)
                    print(f"waiting {PUBLISH_WAIT_S:.0f}s for saves to "
                          "commit and publish")
                    time.sleep(PUBLISH_WAIT_S)

                    def run_pass(tag, base_token):
                        rows = []
                        for doc in range(DOCS):
                            r = measured(proxy_b, [base_token + doc] * PLEN)
                            print(f"[{tag}] doc{doc} ttft={r['ttft']:.3f}s "
                                  f"prefill={r['prefill']:.3f}s "
                                  f"ext_hit={int(r['hit'])}/{int(r['q'])}",
                                  flush=True)
                            rows.append(r)
                        n = max(len(rows), 1)
                        med = sorted(x["ttft"] for x in rows)[n // 2]
                        pre = sum(x["prefill"] for x in rows) / n
                        hits = sum(x["hit"] for x in rows)
                        qs = sum(x["q"] for x in rows) or 1
                        pct = 100 * hits / qs
                        print(f"[{tag}:summary] reqs={n} ttft_p50={med:.3f}s "
                              f"prefill_avg={pre:.3f}s ext_hit_pct={pct:.1f}")
                        return med, pre, pct

                    print(f"=== cross-revisit: same {DOCS} docs via stack B ===")
                    rev_ttft, rev_pre, rev_hit = run_pass("xrevisit", 500)
                    print(f"=== cold baseline: {DOCS} fresh docs via stack B ===")
                    cold_ttft, cold_pre, cold_hit = run_pass("cold", 600)

                    print(f"[gpc:ab] revisit_prefill_avg={rev_pre:.3f}s "
                          f"cold_prefill_avg={cold_pre:.3f}s "
                          f"ttft_p50_ratio={rev_ttft/max(cold_ttft,1e-9):.2f}")

                    # ---- the point of this recipe ----
                    # Cold prefill at 32831 scored tokens is the only
                    # number that compares apples to apples with the
                    # gpc-xstack baseline, which ran the same prompt at
                    # block 4096. Printed with the reference inline so a
                    # reader of the log does not have to go find it.
                    BASELINE_COLD_S = float(
                        os.environ.get("GPC_BASELINE_COLD_S", "3.013"))
                    cold_rate = SCORED / max(cold_pre, 1e-9)
                    base_rate = SCORED / max(BASELINE_COLD_S, 1e-9)
                    print(f"[b2304:cost] cold_prefill={cold_pre:.3f}s "
                          f"({cold_rate:,.0f} tok/s) vs block-4096 baseline "
                          f"{BASELINE_COLD_S:.3f}s ({base_rate:,.0f} tok/s) "
                          f"at the same {SCORED} scored tokens: "
                          f"{100*(cold_rate/base_rate - 1):+.1f}% throughput")

                    # ---- partial-restore model check ----
                    # One hash block comes back from the cache, the 14399
                    # token tail is recomputed. If restore really is a
                    # fixed floor plus linear recompute, the revisit lands
                    # near this prediction. Information only: a mismatch
                    # means the model needs work, not that the stack is
                    # broken.
                    RESTORE_FLOOR_S = float(
                        os.environ.get("GPC_RESTORE_FLOOR_S", "0.35"))
                    predicted = RESTORE_FLOOR_S + TAIL / max(cold_rate, 1e-9)
                    print(f"[b2304:tail] restored={EXPECT_HITS} "
                          f"recomputed={TAIL}; predicted revisit_prefill="
                          f"{predicted:.3f}s (floor {RESTORE_FLOOR_S:.2f}s + "
                          f"tail at cold rate) vs measured {rev_pre:.3f}s "
                          f"(delta {rev_pre - predicted:+.3f}s)")

                    if cold_hit > 5:
                        failures.append(
                            f"cold pass ext_hit_pct={cold_hit:.1f}: fresh "
                            "docs are not cold, the A/B is invalid")
                    # Geometry-derived band, NOT the baseline's >= 90: at
                    # this block size one whole hash block is all a 32832
                    # prompt can claim. Too low means the shared cache did
                    # not serve; too high means the geometry is not what
                    # this file assumes and every other number here is
                    # being read against the wrong reference.
                    if abs(rev_hit - EXPECT_PCT) > HIT_BAND:
                        failures.append(
                            f"cross-revisit ext_hit_pct={rev_hit:.1f} is "
                            f"outside {EXPECT_PCT:.1f} +- {HIT_BAND:.0f} "
                            f"expected for block={BLOCK} pcp={PCP} "
                            f"plen={PLEN}: stack B restored "
                            f"{'less' if rev_hit < EXPECT_PCT else 'more'} "
                            "than one hash block")

                    if failures:
                        print("RESULT: FAIL (" + "; ".join(failures) + ")")
                        sys.exit(1)
                    print(f"RESULT: PASS (cross-stack KA equivalent with "
                          f"{int(ka_hits)} external hits; cross-revisit "
                          f"ext_hit_pct={rev_hit:.1f} at the geometric "
                          f"{EXPECT_PCT:.1f} vs cold {cold_hit:.1f}; prefill "
                          f"{rev_pre:.3f}s vs {cold_pre:.3f}s cold; "
                          f"block-2304 cold throughput "
                          f"{100*(cold_rate/base_rate - 1):+.1f}% vs the "
                          f"block-4096 baseline)")
                    GPC_EOF
                resources:
                  limits:
                    memory: "16Gi"
                    cpu: "4"
                  requests:
                    memory: "8Gi"
                    cpu: "2"
