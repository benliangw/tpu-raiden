# GLOBAL PREFIX CACHE across two disaggregated stacks.
# VARIANT -b2304-plen32832: -b2304 geometry at the BASELINE prompt length.
#
# This one measures a cost, it does not prove a feature. -b2304 showed the
# 2304 block works, but it also shortened the prompt to 18496, so its
# numbers are not comparable with the gpc-xstack baseline's: two variables
# moved at once. Here the prompt goes back to 32832 -- byte-for-byte the
# baseline's -- so gpc-xstack (32832 @ block 4096) vs this one (32832 @
# block 2304) differ only in block_size and its forced chunk companion.
#
# What the j-d90deda6 / j-7c1bb492 pair suggested and this run settles:
# per-token cold prefill throughput fell 10,828 -> 9,681 tok/s (-10.6%)
# when the block shrank. That number is cross-prompt-length, and attention
# being O(n^2) it is if anything charitable to 2304, so the real tax could
# be larger. `cold_prefill_avg` here, compared against the baseline's
# 3.013s at the same 32831 scored tokens, is the answer. Headline number
# is printed as [b2304:cost].
#
# 2304 is the smallest legal block: the Mamba fit floor is
# ceil(2146304 / 1024) = 2096 tokens (one attention page must hold one GDN
# state) and the backend kernel block is 256, so 9 * 256 = 2304. It cuts
# the GDN slot padding from 2048000 B (49% of every state page at 4096) to
# 212992 B (9%).
#
# chunk 4096 -> 4608 comes along, not optional: in align mode the scheduler
# clips each prefill chunk DOWN to a multiple of block_size, so a 4096
# budget against a 2304 block schedules only 2304 tokens and wastes 1792
# (44%) every step. 4608 = 2 * 2304 wastes nothing. compile_sizes tracks it
# or the first step pays a runtime compile.
#
# The hit gate is NOT the baseline's >= 90. Under PCP8 the hash block is
# 2304 * 8 = 18432 tokens, and vLLM caps prefix hits at num_tokens - 1, so
# a 32832-token prompt scores 32831 and can claim exactly ONE whole hash
# block: 18432 hits, 56.1%. The remaining 14399 tokens are an unstorable
# tail and get recomputed on every revisit. The gate below derives that
# expectation from the geometry and holds the measured value to a band
# around it -- a drop to ~0 is a broken cache, a jump to ~99 would mean the
# geometry is not what this file thinks it is. Both are worth failing on.
#
# That partial restore is the second thing this run buys: it is a direct
# read on the "wasted tail" cost. The additive model from the 08-06 sweep
# (restore is a ~0.35s fixed floor, recompute is linear at cold_rate)
# predicts revisit_prefill ~ 0.35 + 14399/cold_rate. [b2304:tail] prints
# predicted vs measured; if they agree the model is usable for sizing
# block_size against real traffic, which is the actual open question.
#
# Caveat worth knowing before reading a failure: 32832 tokens at block 2304
# is 15 decode pages, against 9 for -b2304 and 17 for the two
# -b2304-multiblock recipes that hung the TPU slice mid-seed (both died in
# the libtpu watchdog after a worker stall, not in offload code). If this
# recipe hangs the same way at 15 pages, that is a useful data point in
# itself -- it would point at page/step count rather than at "multiblock"
# as the trigger. A clean PASS narrows the suspect window to 17.
#
# Two complete PCP8+DP8 disagg stacks (each: prefill PCP8/TP1 + decode
# DP8/TP1 + per-stack toy proxy, V2 offload stores on both legs) plus one
# CPU pod running the global registry + orchestrator. The two PREFILL legs
# join the same registry: they share a geometry (pcp8_prefill), so a prefix
# computed and DRAM-cached by stack A's prefill is a byte-compatible REMOTE
# hit for stack B's prefill, pulled P2P via read_remote. Decode stores stay
# local-only: their dense DP-engine layout is namespace-fenced from the PCP
# stripes by design.
#
# The check pod seeds docs through stack A's proxy and revisits them
# through stack B's proxy: stack B's prefill must serve the cacheable part
# from the shared cache (ext_hit_pct near the geometric 56.1%, partially
# collapsed prefill time) while B's fresh-doc cold baseline stays at ~0
# hits. The two qwen35-disagg-xstack-*.yml recipes are the matching
# ablation baselines; gpc-xstack is the block-size comparand.
#
# Deploy prerequisites (on the remote VM, after the raiden wheel build):
#   cp bazel-bin/tpu_raiden/kv_cache/global_registry/global_registry_server \
#      bazel-bin/tpu_raiden/core/controller/raiden_orchestrator_main \
#      /workspace/wheels/
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: ttpu-qwen35-gpc-xstack-b2304-plen32832
  namespace: cloud-devkit-jobs
spec:
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - check
  ttlSecondsAfterFinished: 900
  replicatedJobs:
    # registry: global registry + orchestrator, the phase-4 control plane.
    # CPU-only; must outlive both servers, so it never exits on its own and
    # fails loudly if either binary dies.
    - name: registry
      replicas: 1
      template:
        spec:
          ttlSecondsAfterFinished: 900
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              volumes:
                - name: wheels-nfs
                  nfs:
                    server: 10.225.237.178
                    path: /workspace/wheels
              containers:
                - name: registry
                  image: "us-central1-docker.pkg.dev/cloud-tpu-inference-test/vllm-tpu-rdna/torchtpu-vllm:yinlin_google_com_block-major-raiden-t211b-syncfix"
                  imagePullPolicy: Always
                  env:
                    - name: REGISTRY_PORT
                      value: "48500"
                    - name: ORCH_PORT
                      value: "48600"
                  volumeMounts:
                    - name: wheels-nfs
                      mountPath: /root/wheels
                      readOnly: true
                  command: [ "/bin/bash", "-c" ]
                  args:
                    - |
                      set -eo pipefail
                      : "${CDK_OUTPUT_DIR:=/tmp/cdk-outputs}"
                      export CDK_OUTPUT_DIR
                      mkdir -p "$CDK_OUTPUT_DIR"
                      export GLOG_alsologtostderr=1

                      for bin in global_registry_server raiden_orchestrator_main; do
                        [ -x "/root/wheels/$bin" ] || {
                          echo "RESULT: FAIL (/root/wheels/$bin missing — copy it from" \
                               "bazel-bin after the raiden build, see the recipe header)"
                          exit 1
                        }
                      done

                      echo "Starting global_registry_server on :${REGISTRY_PORT}"
                      /root/wheels/global_registry_server --port="${REGISTRY_PORT}" \
                        > "$CDK_OUTPUT_DIR/registry.log" 2>&1 &
                      REGISTRY_PID=$!
                      echo "Starting raiden_orchestrator_main on :${ORCH_PORT}"
                      /root/wheels/raiden_orchestrator_main --port="${ORCH_PORT}" \
                        > "$CDK_OUTPUT_DIR/orchestrator.log" 2>&1 &
                      ORCH_PID=$!

                      # Either process dying is a hard failure: servers would
                      # silently degrade to local-only lookups.
                      while true; do
                        kill -0 "$REGISTRY_PID" 2>/dev/null || {
                          echo "RESULT: FAIL (global_registry_server exited)"
                          tail -50 "$CDK_OUTPUT_DIR/registry.log"; exit 1
                        }
                        kill -0 "$ORCH_PID" 2>/dev/null || {
                          echo "RESULT: FAIL (raiden_orchestrator_main exited)"
                          tail -50 "$CDK_OUTPUT_DIR/orchestrator.log"; exit 1
                        }
                        sleep 5
                      done
                  resources:
                    limits:
                      memory: "8Gi"
                      cpu: "4"
                    requests:
                      memory: "4Gi"
                      cpu: "2"

    # ---------------------------------------------------------
    # STACK A: PREFILL (PCP8) + PROXY, then DECODE (DP8)
    # ---------------------------------------------------------
    - name: prefill-a
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            spec:
              dnsPolicy: ClusterFirstWithHostNet
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x1
                cloud.google.com/gke-tpu-accelerator: tpu7x
              initContainers:
                - name: tpu-node-setup
                  image: busybox
                  securityContext:
                    privileged: true
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      sysctl -w vm.max_map_count=8388608
                      if [ -f /sys/module/vfio_iommu_type1/parameters/dma_entry_limit ]; then
                        echo 2000000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit
                        echo "Successfully increased dma_entry_limit"
                      fi
              containers:
              - name: vllm-tpu-prefill
                image: us-central1-docker.pkg.dev/cloud-tpu-inference-test/vllm-tpu-rdna/vllm-torchtpu-benliangw_google_com:latest
                imagePullPolicy: Always
                command: ["/bin/bash", "-c"]
                args:
                - |
                  set -eo pipefail
                  : "${CDK_OUTPUT_DIR:=/tmp/cdk-outputs}"
                  export CDK_OUTPUT_DIR
                  mkdir -p "$CDK_OUTPUT_DIR"
                  export PYTHONUNBUFFERED=1

                  echo "===== Syncing dependencies to pyproject.toml ====="
                  # Keep the vllm== pin: this installs the pinned vLLM from
                  # PyPI, replacing the image's editable install of the NFS
                  # checkout at /root/cloud-devkit/vllm (which can drift from
                  # the version the torchtpu-vllm code expects). Only the
                  # torch-tpu pin is stripped; it is installed from a wheel
                  # below.
                  mkdir -p /tmp/depsync
                  sed -E '/"torch-tpu==/d' /root/torchtpu-vllm/pyproject.toml > /tmp/depsync/pyproject.toml
                  uv pip install --system -r /tmp/depsync/pyproject.toml --index-url https://pypi.org/simple


                  # Pinned tpu-raiden build; serves both raiden control
                  # planes in this pod.
                  uv pip install --system --no-deps \
                    "$RAIDEN_WHEEL"
                  python3 -c "from tpu_raiden.rpc.raiden_controller import RaidenController, RaidenControllerServer" \
                    || { echo "RESULT: FAIL (raiden import)"; exit 1; }

                  export PYTHONPATH=/root/torchtpu-vllm/src:/root/torchtpu-vllm:${PYTHONPATH:-}

                  python3 -c 'from tpu_raiden.api.torch import torch_tpu_common_loader as tl; tl.load_torch_tpu_common(); from tpu_raiden.frameworks.torch import _tpu_raiden_torch as trt; S = trt.KVCacheStore; assert hasattr(S, "num_registered_workers"), "raiden wheel too old (missing num_registered_workers)"; import vllm_torchtpu.offload.raiden_connector as rc; assert hasattr(rc, "TPURaidenOffloadingConnector"); print("V2 preflight OK")' \
                    || { echo "RESULT: FAIL (V2 preflight)"; exit 1; }

                  # Two raiden control planes coexist in this pod (disagg
                  # controller + offload store controller); without this,
                  # ControllerServer is a process-wide singleton that
                  # silently reuses the first bound port.
                  export RAIDEN_DISABLE_SINGLETON_WORKER=1

                  export VLLM_HOST_IP="${JS_NAME}-prefill-a-0-0.${JS_NAME}"
                  NS="${JS_NAME//[^a-zA-Z0-9_]/_}"
                  export TPU_KV_TRANSFER_NAMESPACE="${NS}_prefill_a"
                  export TPU_RAIDEN_JOB_NAME=prefill_a
                  export TPU_RAIDEN_ENGINE_ID="${JS_NAME}-prefill-a-engine"
                  export TPU_RAIDEN_CONTROLLER_ADDRESS="${VLLM_HOST_IP}:${CONTROLLER_PORT}"

                  echo "===== Pre-downloading $MODEL snapshot ====="
                  DL_OK=""
                  for i in $(seq 1 30); do
                    if python3 -c "import os; from huggingface_hub import snapshot_download; snapshot_download(os.environ['MODEL'])"; then
                      DL_OK=1; break
                    fi
                    echo "snapshot_download failed (attempt $i/30); retrying in 60s"
                    sleep 60
                  done
                  [ -n "$DL_OK" ] || { echo "RESULT: FAIL (model snapshot download)"; exit 1; }
                  export HF_HUB_OFFLINE=1

                  # The registry never retries a failed RegisterStore, so
                  # wait for both control-plane ports before binding the
                  # offload store.
                  REGISTRY_HOST="${JS_NAME}-registry-0-0.${JS_NAME}"
                  for port in "${REGISTRY_PORT}" "${ORCH_PORT}"; do
                    echo "Waiting for ${REGISTRY_HOST}:${port} (up to 10 min)..."
                    waited=0
                    until (exec 3<>"/dev/tcp/${REGISTRY_HOST}/${port}") 2>/dev/null; do
                      exec 3>&- 2>/dev/null || true
                      [ "$waited" -ge 600 ] && { echo "RESULT: FAIL (${REGISTRY_HOST}:${port} not reachable)"; exit 1; }
                      sleep 2; waited=$((waited + 2))
                    done
                    exec 3>&- 2>/dev/null || true
                    echo "${REGISTRY_HOST}:${port} reachable (${waited}s)"
                  done

                  echo "===== Starting Raiden controller on :${CONTROLLER_PORT} ====="
                  cat > /tmp/raiden_controller.py <<'PYEOF'
                  import argparse, json, logging, os, signal, threading, time
                  from pathlib import Path
                  from tpu_raiden.rpc.raiden_controller import RaidenController, RaidenControllerServer

                  parser = argparse.ArgumentParser()
                  parser.add_argument("--port", type=int, required=True)
                  parser.add_argument("--advertise-host", required=True)
                  parser.add_argument("--request-registry-ttl-s", type=float, default=600.0)
                  parser.add_argument("--ready-file", type=Path, required=True)
                  args = parser.parse_args()

                  logging.basicConfig(level=logging.INFO,
                                      format="%(asctime)s %(levelname)s %(message)s",
                                      force=True)
                  stopping = threading.Event()
                  signal.signal(signal.SIGINT, lambda *_: stopping.set())
                  signal.signal(signal.SIGTERM, lambda *_: stopping.set())

                  controller = RaidenController(port=args.port,
                                                request_registry_ttl_s=args.request_registry_ttl_s)
                  server = RaidenControllerServer(controller)
                  server.start()
                  payload = {
                      "schema_version": 1,
                      "event": "raiden_controller_ready",
                      "pid": os.getpid(),
                      "requested_port": args.port,
                      "port": server.port,
                      "advertise_host": args.advertise_host,
                      "address": f"{args.advertise_host}:{server.port}",
                      "request_registry_ttl_s": args.request_registry_ttl_s,
                      "time_unix_s": time.time(),
                  }
                  args.ready_file.parent.mkdir(parents=True, exist_ok=True)
                  tmp = args.ready_file.with_name(f".{args.ready_file.name}.{os.getpid()}.tmp")
                  tmp.write_text(json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8")
                  tmp.replace(args.ready_file)
                  print(json.dumps(payload, sort_keys=True), flush=True)
                  try:
                      while not stopping.wait(1.0):
                          pass
                  finally:
                      server.stop()
                  PYEOF
                  rm -f /tmp/controller.ready.json
                  python3 /tmp/raiden_controller.py \
                    --port "$CONTROLLER_PORT" \
                    --advertise-host "$VLLM_HOST_IP" \
                    --request-registry-ttl-s 600 \
                    --ready-file /tmp/controller.ready.json \
                    > "$CDK_OUTPUT_DIR/controller.log" 2>&1 &
                  CONTROLLER_PID=$!
                  for i in $(seq 1 200); do
                    [ -s /tmp/controller.ready.json ] && break
                    kill -0 "$CONTROLLER_PID" 2>/dev/null \
                      || { echo "RESULT: FAIL (controller exited)"; cat "$CDK_OUTPUT_DIR/controller.log"; exit 1; }
                    sleep 0.5
                  done
                  [ -s /tmp/controller.ready.json ] || { echo "RESULT: FAIL (controller not ready)"; exit 1; }
                  cat /tmp/controller.ready.json

                  COMPILATION_CONFIG='{"backend":"vllm_torchtpu.compilation.tpu_compiler.TpuCompilerAdaptor","compile_sizes":[4608],"inductor_compile_config":{"enable_auto_functionalized_v2":false,"size_asserts":false,"alignment_asserts":false,"scalar_asserts":false}}'

                  # Raiden must remain first for load arbitration. PCP8 is one
                  # engine, so its 256 GiB store is sharded across the 8 PCP
                  # workers (one controller at OFFLOAD_CONTROLLER_PORT; no DP
                  # offset). --kv-offloading-size would replace this child
                  # config.
                  KV_TRANSFER_CONFIG='{"kv_connector":"TPUMultiConnector","kv_connector_module_path":"vllm_torchtpu.distributed.kv_transfer.tpu_multi_connector","kv_role":"kv_producer","kv_connector_extra_config":{"connectors":[{"kv_connector":"TPURaidenConnector","kv_connector_module_path":"vllm_torchtpu.distributed.kv_transfer.tpu_connector","kv_role":"kv_producer","kv_port":14579},{"kv_connector":"TPURaidenOffloadingConnector","kv_connector_module_path":"vllm_torchtpu.offload.raiden_connector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":274877906944,"raiden_controller_port":'"$OFFLOAD_CONTROLLER_PORT"',"raiden_job_name":"gpc-prefill-a","global_registry_address":"'"$REGISTRY_HOST"':'"$REGISTRY_PORT"'","raiden_orchestrator_address":"'"$REGISTRY_HOST"':'"$ORCH_PORT"'","store_server_ip":"'"$MY_POD_IP"'"}}]}}'

                  echo "===== Starting Qwen3.5 PCP8 prefill node (disagg+offload) ====="
                  exec vllm serve \
                    "$MODEL" \
                    --served-model-name "$SERVED_MODEL" \
                    --trust-remote-code \
                    --seed 42 \
                    --max-model-len 65536 \
                    --enable-expert-parallel \
                    --disable-custom-all-reduce \
                    --gpu-memory-utilization 0.9 \
                    --kv-cache-dtype fp8 \
                    --language-model-only \
                    --max-num-batched-tokens 4608 \
                    --max-num-seqs 16 \
                    --no-disable-hybrid-kv-cache-manager \
                    --attention-backend CUSTOM \
                    --mamba-cache-mode align \
                    --enable-prompt-tokens-details \
                    --no-enable-log-requests \
                    --compilation-config "$COMPILATION_CONFIG" \
                    --enable-prefix-caching \
                    --no-async-scheduling \
                    --block-size 2304 \
                    --tensor-parallel-size 1 \
                    --host 0.0.0.0 \
                    --port 8000 \
                    --num-gpu-blocks-override 128 \
                    --prefill-context-parallel-size 8 \
                    --cp-kv-cache-interleave-size 256 \
                    --kv-transfer-config "$KV_TRANSFER_CONFIG" \
                    2>&1 | tee "$CDK_OUTPUT_DIR/server.log"
                env:
                  - name: JS_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
                  - name: MY_POD_IP
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  - name: REGISTRY_PORT
                    value: "48500"
                  - name: ORCH_PORT
                    value: "48600"
                  # Cross-stack sharing needs identical block-hash chains on
                  # BOTH prefill legs: vLLM seeds the chain with
                  # NONE_HASH = os.urandom(32) when PYTHONHASHSEED is unset,
                  # so stack B's registry lookups could never match stack A's
                  # published keys.
                  - name: PYTHONHASHSEED
                    value: "0"
                  - name: MODEL
                    value: "Qwen/Qwen3.5-35B-A3B-FP8"
                  - name: SERVED_MODEL
                    value: "Qwen3.5-35B-A3B-FP8"
                  - name: CONTROLLER_PORT
                    value: "27000"
                  # V2 offload store controller (second raiden control
                  # plane); distinct from the disagg CONTROLLER_PORT above,
                  # TPU_KV_TRANSFER_PORT 9100, side channel 9600, and
                  # kv_port 14579.
                  - name: OFFLOAD_CONTROLLER_PORT
                    value: "47800"
                  - name: VLLM_LOGGING_LEVEL
                    value: "INFO"
                  - name: HF_HUB_DISABLE_XET
                    value: "1"
                  # --- device / topology (8 devices on one 2x2x1 tpu7x host) ---
                  - name: JAX_PLATFORMS
                    value: "tpu,cpu"
                  - name: PJRT_DEVICE
                    value: TPU
                  - name: TPU_BACKEND_TYPE
                    value: "jax"
                  - name: VLLM_TARGET_DEVICE
                    value: "tpu"
                  - name: TPU_TOPOLOGY
                    value: "2x2x1"
                  - name: TPU_CHIPS_PER_HOST_BOUNDS
                    value: "2,2,1"
                  - name: TPU_HOST_BOUNDS
                    value: "1,1,1"
                  - name: TPU_LIBRARY_PATH
                    value: ""
                  - name: MEGASCALE_NUM_SLICES
                    value: ""
                  - name: MEGASCALE_SLICE_ID
                    value: ""
                  - name: TPU_PROCESS_ADDRESSES
                    value: ""
                  - name: TPU_WORKER_HOSTNAMES
                    value: ""
                  - name: TPU_PROCESS_PORT
                    value: ""
                  - name: MEGASCALE_COORDINATOR_ADDRESS
                    value: ""
                  - name: MEGASCALE_PORT
                    value: ""
                  # --- model / kernel config ---
                  - name: MODEL_IMPL_TYPE
                    value: "vllm"
                  - name: NEW_MODEL_DESIGN
                    value: "0"
                  - name: SKIP_JAX_PRECOMPILE
                    value: "1"
                  - name: VLLM_XLA_CHECK_RECOMPILATION
                    value: "0"
                  - name: USE_MOE_SPARSE_CORE
                    value: "0"
                  - name: TPUMISC_HMA_CHECKSUM_TRACE
                    value: "0"
                  - name: TPU_GDN_CONV_STATE_TILE_PAD
                    value: "1"
                  - name: XLA_PYTHON_CLIENT_PREALLOCATE
                    value: "false"
                  - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
                    value: "1"
                  - name: USE_BATCHED_RPA_KERNEL
                    value: "1"
                  - name: RAGGED_GATED_DELTA_RULE_IMPL
                    value: "chunked_kernel_v3_pd"
                  - name: ONEHOT_MOE_PERMUTE_THRESHOLD
                    value: "1024"
                  - name: TPU_RAGGED_GATHER_REDUCE_IMPL
                    value: "fallback"
                  - name: TPU_RAGGED_GATHER_IMPL
                    value: "fallback"
                  - name: LIBTPU_INIT_ARGS
                    value: "--xla_tpu_scoped_vmem_limit_kib=65536 --xla_tpu_enable_latency_hiding_scheduler=false"
                  # libtpu 0.0.43 can take longer than the 120 s default to
                  # bootstrap the PCP8 LOCAL_RANK remap probe.
                  - name: TPU_PCP_REMAP_PROBE_TIMEOUT_S
                    value: "600"
                  # Include model load, KV-cache profiling, and warmup.
                  - name: VLLM_ENGINE_READY_TIMEOUT_S
                    value: "1800"
                  - name: TORCH_TPU_INTERNAL_TIER2_COMPILATION_CACHE
                    value: "disabled"
                  # --- Raiden KV transfer ---
                  - name: TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL
                    value: "1"
                  - name: TPU_USE_RAIDEN_KV_CACHE_MANAGER
                    value: "1"
                  - name: TPU_RAIDEN_QWEN35_ADMISSION
                    value: "1"
                  - name: TPU_KV_RESHARD_TRANSPORT
                    value: "raiden"
                  # Producer-side Stage-3 byte-span lowering needs the
                  # destination page geometry; it cannot read the decoder's
                  # block_size. Must track decode's --block-size 2304.
                  - name: TPU_KV_RESHARD_DST_PAGE_TOKENS
                    value: "2304"
                  # Pinned tpu-raiden build. Anchored once and
                  # aliased by the other three legs, so the
                  # stacks can never run mixed wheels.
                  - name: RAIDEN_WHEEL
                    value: &raiden-wheel "/root/wheels/tpu_raiden_torch-0.0.1.dev20260805174527-1_raiden_controller_0cc40b6-cp312-cp312-manylinux_2_31_x86_64.whl"
                  - name: TPU_RAIDEN_TRANSFER_PARALLELISM
                    value: "8"
                  - name: TPU_ENABLE_D2H_TRANSFER
                    value: "1"
                  - name: TPU_HMA_D2H_COPY_IMPL
                    value: "device_put"
                  - name: TPU_HMA_MIN_DONE_RECVING_BATCH
                    value: "1"
                  - name: TPU_HMA_MAX_DONE_RECVING_BATCH
                    value: "1"
                  - name: TPU_HMA_MAX_INFLIGHT_D2H_SENDS
                    value: "1"
                  - name: TPU_HMA_MAX_INFLIGHT_PULLS
                    value: "8"
                  - name: TPU_MAX_HOST_KV_BUFFER_SIZE
                    value: "64"
                  # Exceeds measured claim latency while bounding how long an
                  # abandoned request can pin the prefill block pool.
                  - name: TPU_P2P_WAIT_PULL_TIMEOUT
                    value: "300"
                  - name: TPU_KV_SHM_POOL_GB
                    value: "8"
                  - name: TPU_KV_TRANSFER_PORT
                    value: "9100"
                  - name: TPU_SIDE_CHANNEL_PORT
                    value: "9600"
                  # --- KV offloading: V2 store path (see KV_TRANSFER_CONFIG);
                  # the V1 VLLM_TPU_OFFLOAD_RAIDEN knob does not apply. ---
                volumeMounts:
                  - name: hf-token-volume
                    mountPath: /root/.cache/huggingface/token
                    subPath: token
                    readOnly: true
                  - name: huggingface-storage
                    mountPath: /root/.cache/huggingface/
                  - name: dshm
                    mountPath: /dev/shm
                  - name: torchtpu-vllm-nfs
                    mountPath: /root/torchtpu-vllm
                  - name: vllm-nfs
