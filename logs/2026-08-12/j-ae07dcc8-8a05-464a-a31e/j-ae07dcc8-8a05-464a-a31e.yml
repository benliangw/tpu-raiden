                  # plane); distinct from the disagg CONTROLLER_PORT above,
                  # TPU_KV_TRANSFER_PORT 9100, side channel 9600, and
                  # kv_port 14579.
                  - name: OFFLOAD_CONTROLLER_PORT
                    value: "47800"
                  - name: VLLM_LOGGING_LEVEL
                    value: "INFO"
                  - name: HF_HUB_DISABLE_XET
                    value: "1"
                  # --- device / topology (8 devices on one 2x2x1 tpu7x host) ---
                  - name: JAX_PLATFORMS
                    value: "tpu,cpu"
                  - name: PJRT_DEVICE
                    value: TPU
                  - name: TPU_BACKEND_TYPE
                    value: "jax"
                  - name: VLLM_TARGET_DEVICE
                    value: "tpu"
                  - name: TPU_TOPOLOGY
                    value: "2x2x1"
                  - name: TPU_CHIPS_PER_HOST_BOUNDS
                    value: "2,2,1"
                  - name: TPU_HOST_BOUNDS
                    value: "1,1,1"
                  - name: TPU_LIBRARY_PATH
                    value: ""
                  - name: MEGASCALE_NUM_SLICES
                    value: ""
                  - name: MEGASCALE_SLICE_ID
                    value: ""
                  - name: TPU_PROCESS_ADDRESSES
                    value: ""
                  - name: TPU_WORKER_HOSTNAMES
                    value: ""
                  - name: TPU_PROCESS_PORT
                    value: ""
                  - name: MEGASCALE_COORDINATOR_ADDRESS
                    value: ""
                  - name: MEGASCALE_PORT
                    value: ""
                  # --- model / kernel config ---
                  - name: MODEL_IMPL_TYPE
                    value: "vllm"
                  - name: NEW_MODEL_DESIGN
                    value: "0"
                  - name: SKIP_JAX_PRECOMPILE
                    value: "1"
                  - name: VLLM_XLA_CHECK_RECOMPILATION
                    value: "0"
                  - name: USE_MOE_SPARSE_CORE
                    value: "0"
                  - name: TPUMISC_HMA_CHECKSUM_TRACE
                    value: "0"
                  - name: TPU_GDN_CONV_STATE_TILE_PAD
                    value: "1"
                  - name: XLA_PYTHON_CLIENT_PREALLOCATE
                    value: "false"
                  - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
                    value: "1"
                  - name: USE_BATCHED_RPA_KERNEL
                    value: "1"
                  - name: RAGGED_GATED_DELTA_RULE_IMPL
                    value: "chunked_kernel_v3_pd"
                  - name: ONEHOT_MOE_PERMUTE_THRESHOLD
                    value: "1024"
                  - name: TPU_RAGGED_GATHER_REDUCE_IMPL
                    value: "fallback"
                  - name: TPU_RAGGED_GATHER_IMPL
                    value: "fallback"
                  - name: LIBTPU_INIT_ARGS
                    value: "--xla_tpu_scoped_vmem_limit_kib=65536 --xla_tpu_enable_latency_hiding_scheduler=false"
                  - name: TORCH_TPU_INTERNAL_TIER2_COMPILATION_CACHE
                    value: "disabled"
                  # --- Raiden KV transfer ---
                  - name: TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL
                    value: "1"
                  - name: TPU_USE_RAIDEN_KV_CACHE_MANAGER
                    value: "1"
                  - name: TPU_RAIDEN_QWEN35_ADMISSION
                    value: "1"
                  - name: TPU_KV_RESHARD_TRANSPORT
                    value: "raiden"
                  # Producer-side Stage-3 byte-span lowering needs the
                  # destination page geometry; it cannot read the decoder's
                  # block_size. Must track decode's --block-size 4096.
                  - name: TPU_KV_RESHARD_DST_PAGE_TOKENS
                    value: "4096"
                  - name: RAIDEN_WHEEL
                    value: *raiden-wheel
                  - name: TPU_RAIDEN_TRANSFER_PARALLELISM
                    value: "8"
                  - name: TPU_ENABLE_D2H_TRANSFER
                    value: "1"
                  - name: TPU_HMA_D2H_COPY_IMPL
                    value: "device_put"
                  - name: TPU_HMA_MIN_DONE_RECVING_BATCH
                    value: "1"
                  - name: TPU_HMA_MAX_DONE_RECVING_BATCH
                    value: "1"
                  - name: TPU_HMA_MAX_INFLIGHT_D2H_SENDS
                    value: "1"
                  - name: TPU_HMA_MAX_INFLIGHT_PULLS
                    value: "8"
                  - name: TPU_MAX_HOST_KV_BUFFER_SIZE
                    value: "64"
                  # Exceeds measured claim latency while bounding how long an
                  # abandoned request can pin the small prefill block pool.
                  - name: TPU_P2P_WAIT_PULL_TIMEOUT
                    value: "300"
                  - name: TPU_KV_SHM_POOL_GB
                    value: "8"
                  - name: TPU_KV_TRANSFER_PORT
                    value: "9100"
                  - name: TPU_SIDE_CHANNEL_PORT
                    value: "9600"
                  # --- KV offloading: V2 store path (see KV_TRANSFER_CONFIG);
                  # the V1 VLLM_TPU_OFFLOAD_RAIDEN knob does not apply. ---
                volumeMounts:
                  - name: models-nfs

                    mountPath: /root/models

                    readOnly: true
                  - name: dshm
                    mountPath: /dev/shm
                  - name: torchtpu-vllm-nfs
                    mountPath: /root/torchtpu-vllm
                  - name: vllm-nfs
                    mountPath: /root/cloud-devkit/vllm
                  - name: wheels-nfs
                    mountPath: /root/wheels
                    readOnly: true
                securityContext:
                  privileged: true
                  capabilities:
                    add:
                    - IPC_LOCK
                resources:
                  limits:
                    google.com/tpu: "4"
                    memory: "850Gi"
                    cpu: "200"
                    ephemeral-storage: "100Gi"
                  requests:
                    google.com/tpu: "4"
                    memory: "850Gi"
                    cpu: "200"
                    ephemeral-storage: "50Gi"
                ports:
                  - containerPort: 7200

              volumes:
              - name: dshm
                emptyDir:
                  medium: Memory
              - name: models-nfs

                nfs:

                  server: 10.225.237.178

                  path: /workspace/models
              - name: torchtpu-vllm-nfs
                nfs:
                  server: 10.225.237.178
                  # Branch worktree, not the repo root: pins the job to
                  # benliangw/gpc_ablation (raiden_controller + the
                  # remote_lookup knob and transfer-timing logs); all four
                  # suite arms mount the same branch.
                  path: /workspace/vllm-torchtpu/gpc_ablation
              - name: vllm-nfs
                nfs:
                  server: 10.225.237.178
                  path: /workspace/vllm
              - name: wheels-nfs
                nfs:
                  server: 10.225.237.178
                  path: /workspace/wheels

    # ---------------------------------------------------------
    # CHECK: the cross-stack evidence gate
    # ---------------------------------------------------------
    - name: check
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
              - name: gpc-check
                image: vllm/vllm-tpu:nightly
                imagePullPolicy: Always
                env:
                  - name: JS_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
                  - name: MODEL
                    value: "Qwen3.5-35B-A3B-FP8"
                  - name: PROXY_PORT
                    value: "10000"
                  - name: GPC_DOCS
                    value: "48"
                  - name: GPC_PROMPT_TOKENS
                    value: "32832"
                  - name: PUBLISH_WAIT_S
                    value: "15"
                command: ["/bin/bash", "-c"]
                args:
                  - |
                    set -eo pipefail
                    : "${CDK_OUTPUT_DIR:=/tmp/cdk-outputs}"
                    export CDK_OUTPUT_DIR
                    mkdir -p "$CDK_OUTPUT_DIR"
                    export PYTHONUNBUFFERED=1

                    PA="${JS_NAME}-prefill-a-0-0.${JS_NAME}"
                    PB="${JS_NAME}-prefill-b-0-0.${JS_NAME}"
                    DA="${JS_NAME}-decode-a-0-0.${JS_NAME}"
                    DB="${JS_NAME}-decode-b-0-0.${JS_NAME}"
                    PROXY_A="http://${PA}:${PROXY_PORT}"
                    PROXY_B="http://${PB}:${PROXY_PORT}"

                    wait_for() {
                      local name="$1" url="$2" timeout="$3" elapsed=0 interval=5
                      echo "Waiting for $name up ($url, up to ${timeout}s)"
                      until curl -sf "$url" > /dev/null; do
                        if [ "$elapsed" -ge "$timeout" ]; then
                          echo "RESULT: FAIL ($name did not become healthy within ${timeout}s)" >&2
                          exit 1
                        fi
                        sleep "$interval"; elapsed=$((elapsed + interval))
                      done
                      echo "$name is up (${elapsed}s)"
                    }

                    wait_for prefill-a "http://$PA:8000/health" $((90 * 60))
                    wait_for decode-a  "http://$DA:7200/health" $((90 * 60))
                    wait_for proxy-a   "$PROXY_A/healthcheck"   $((10 * 60))
                    wait_for prefill-b "http://$PB:8000/health" $((90 * 60))
                    wait_for decode-b  "http://$DB:7200/health" $((90 * 60))
                    wait_for proxy-b   "$PROXY_B/healthcheck"   $((10 * 60))

                    # Engine readiness doubles as the registration-gate
                    # warm-up on all four stores (the first request through
                    # each proxy triggers deferred worker registration).
                    for leg in A B; do
                      PROXY_VAR="PROXY_$leg"; PROXY="${!PROXY_VAR}"
                      echo "Waiting for stack-$leg engine readiness (first compile, up to 60 min)..."
                      # Wall-clock deadline: a hung curl consumes up to
                      # its --max-time on top of the sleep, so counting
                      # sleeps alone could stretch far past 60 minutes.
                      deadline=$((SECONDS + 60 * 60))
                      until curl -sf --max-time 300 -X POST "$PROXY/v1/completions" \
                          -H "Content-Type: application/json" \
                          -d "{\"model\": \"$MODEL\", \"prompt\": \"Hello\", \"max_tokens\": 5}" > /dev/null; do
                        if [ "$SECONDS" -ge "$deadline" ]; then
                          echo "RESULT: FAIL (stack-$leg engine not ready within 60 minutes)"; exit 1
                        fi
                        echo "stack-$leg compiling, waiting 30s..."; sleep 30
                      done
                      echo "stack-$leg engines are ready."
                    done
                    sleep 5

                    python3 - "$PROXY_A" "$PROXY_B" "http://$PB:8000" "http://$PA:8000" \
                        "$MODEL" <<'GPC_EOF'
                    import json
                    import os
                    import re
                    import sys
                    import time
                    import urllib.request

                    proxy_a, proxy_b, prefill_b, prefill_a, model = sys.argv[1:]
                    DOCS = int(os.environ.get("GPC_DOCS", "48"))
                    PLEN = int(os.environ.get("GPC_PROMPT_TOKENS", "32832"))
                    PUBLISH_WAIT_S = float(os.environ.get("PUBLISH_WAIT_S", "15"))

                    KEYS = dict(ttft_s="time_to_first_token_seconds_sum",
                                ttft_n="time_to_first_token_seconds_count",
                                pre_s="request_prefill_time_seconds_sum",
                                pre_n="request_prefill_time_seconds_count",
                                hit="external_prefix_cache_hits_total",
                                q="external_prefix_cache_queries_total")

                    def scrape(base):
                        with urllib.request.urlopen(f"{base}/metrics",
                                                    timeout=30) as r:
                            text = r.read().decode()
                        m = {}
                        for line in text.splitlines():
                            if line.startswith("#"):
                                continue
                            mo = re.match(
                                r"vllm:([a-z_0-9]+)\{.*\} ([0-9.e+-]+)$", line)
                            if mo:
                                m[mo.group(1)] = (m.get(mo.group(1), 0.0)
                                                  + float(mo.group(2)))
                        return m

                    def ask(base, prompt, max_tokens):
                        payload = {
                            "model": model, "prompt": prompt,
                            "max_tokens": max_tokens, "temperature": 0.0,
                            "seed": 0, "ignore_eos": True,
                            "add_special_tokens": False,
                            "return_token_ids": True,
                        }
                        req = urllib.request.Request(
                            base + "/v1/completions",
                            data=json.dumps(payload).encode(),
                            headers={"Content-Type": "application/json"})
                        with urllib.request.urlopen(req, timeout=900) as r:
                            return json.loads(r.read())["choices"][0].get(
                                "token_ids")

                    # Serial requests on quiet engines: a per-request metrics
                    # delta on the measured prefill is exactly that request.
                    def measured(base_proxy, prompt, prefill_base):
                        before = scrape(prefill_base)
                        ask(base_proxy, prompt, 1)
                        after = scrape(prefill_base)
                        d = {k: after.get(v, 0) - before.get(v, 0)
                             for k, v in KEYS.items()}
                        return {"ttft": d["ttft_s"] / (d["ttft_n"] or 1),
                                "prefill": d["pre_s"] / (d["pre_n"] or 1),
                                "hit": d["hit"], "q": d["q"]}

                    failures = []

                    # ---- stage 1: cross-stack known-answer probe ----
                    # A greedy KA probe cold through stack A, replayed
                    # through stack B. The hard gates are B's external
                    # prefix hits (proof the shared cache served it) and an
                    # early-divergence check: corrupt restored KV garbles
                    # output from the first tokens, while the stack's benign
                    # run-to-run nondeterminism flips at most a later token.
                    # Full token equality is printed as information only —
                    # never gate this stack on byte-identical outputs.
                    # The prompt must EXCEED one 32768-token hash block:
                    # vLLM caps prefix hits at num_tokens - 1, so an
                    # exactly-one-chunk prompt can never claim its own chunk
                    # and the offload lookup short-circuits before the
                    # registry. The doubled wait covers stack A's very first
                    # save+publish.
                    print("=== stage 1: cross-stack KA (32832 tokens) ===")
                    ka_a = ask(proxy_a, [89] * 32832, 8)
                    time.sleep(2 * PUBLISH_WAIT_S)
                    before = scrape(prefill_b)
                    ka_b = ask(proxy_b, [89] * 32832, 8)
                    delta = scrape(prefill_b)
                    ka_hits = delta.get(KEYS["hit"], 0) - before.get(
                        KEYS["hit"], 0)
                    print(f"ka: A={ka_a} B={ka_b} "
                          f"identical={bool(ka_a) and ka_a == ka_b} "
                          f"b_prefill_ext_hits={ka_hits}")
                    if not ka_a or not ka_b or ka_a[:2] != ka_b[:2]:
                        failures.append(
                            "cross-stack KA diverged at the first tokens "
                            f"(corrupt served KV?): A={ka_a} B={ka_b}")
                    if ka_hits <= 0:
                        failures.append(
                            "cross-stack KA replay produced no external hits "
                            "on stack B's prefill — it recomputed instead of "
                            "pulling from the shared cache")

                    # ---- stage 2: cross-restore A/B ----
                    # Seed docs through stack A; revisit them through stack
                    # B (must be served by the shared cache); fresh docs
                    # through stack B (cold baseline, must NOT hit).
                    print(f"=== stage 2: seeding {DOCS} docs via stack A ===")
                    for doc in range(DOCS):
                        ask(proxy_a, [500 + doc] * PLEN, 1)
                    print(f"waiting {PUBLISH_WAIT_S:.0f}s for saves to "
                          "commit and publish")
                    time.sleep(PUBLISH_WAIT_S)

                    def run_pass(tag, base_proxy, base_token, prefill_base):
                        rows = []
                        for doc in range(DOCS):
                            r = measured(base_proxy,
                                         [base_token + doc] * PLEN,
                                         prefill_base)
                            print(f"[{tag}] doc{doc} ttft={r['ttft']:.3f}s "
                                  f"prefill={r['prefill']:.3f}s "
                                  f"ext_hit={int(r['hit'])}/{int(r['q'])}",
                                  flush=True)
                            rows.append(r)
                        n = max(len(rows), 1)
                        med = sorted(x["ttft"] for x in rows)[n // 2]
                        pre = sum(x["prefill"] for x in rows) / n
                        hits = sum(x["hit"] for x in rows)
                        qs = sum(x["q"] for x in rows) or 1
                        pct = 100 * hits / qs
                        print(f"[{tag}:summary] reqs={n} ttft_p50={med:.3f}s "
                              f"prefill_avg={pre:.3f}s ext_hit_pct={pct:.1f}")
                        return med, pre, pct

                    # INFO-ONLY local-restore leg: same docs back through
                    # stack A, served from A's OWN DRAM (a full local hit
                    # never queries the registry). Against x-revisit below —
                    # same run, same store contents — the prefill delta is
                    # the remote path's extra cost (registry lookup + P2P
                    # pull); prefill-b's connector log splits those two.
                    # Deliberately ungated: this recipe's gates stay
                    # exactly the cross-stack ones.
                    print(f"=== a-revisit (info only): same {DOCS} docs via stack A ===")
                    arev_ttft, arev_pre, arev_hit = run_pass(
                        "arevisit", proxy_a, 500, prefill_a)
                    print(f"=== cross-revisit: same {DOCS} docs via stack B ===")
                    rev_ttft, rev_pre, rev_hit = run_pass(
                        "xrevisit", proxy_b, 500, prefill_b)
                    print(f"=== cold baseline: {DOCS} fresh docs via stack B ===")
                    cold_ttft, cold_pre, cold_hit = run_pass(
                        "cold", proxy_b, 600, prefill_b)

                    print(f"[gpc:ab] arevisit_prefill_avg={arev_pre:.3f}s "
                          f"(local restore, ext_hit_pct={arev_hit:.1f}) "
                          f"revisit_prefill_avg={rev_pre:.3f}s "
                          f"cold_prefill_avg={cold_pre:.3f}s "
                          f"remote_minus_local_prefill={rev_pre-arev_pre:.3f}s "
                          f"ttft_p50_ratio={rev_ttft/max(cold_ttft,1e-9):.2f}")

                    if cold_hit > 5:
                        failures.append(
                            f"cold pass ext_hit_pct={cold_hit:.1f}: fresh "
                            "docs are not cold, the A/B is invalid")
                    if rev_hit < 90:
                        failures.append(
                            f"cross-revisit ext_hit_pct={rev_hit:.1f} < 90: "
                            "stack B did not serve stack A's docs from the "
                            "shared cache")

                    if failures:
                        print("RESULT: FAIL (" + "; ".join(failures) + ")")
                        sys.exit(1)
                    print(f"RESULT: PASS (cross-stack KA equivalent with "
                          f"{int(ka_hits)} external hits; cross-revisit "
                          f"ext_hit_pct={rev_hit:.1f} vs cold "
                          f"{cold_hit:.1f}; prefill {rev_pre:.3f}s vs "
                          f"{cold_pre:.3f}s cold)")
                    GPC_EOF
                resources:
                  limits:
                    memory: "16Gi"
                    cpu: "4"
                  requests:
                    memory: "8Gi"
                    cpu: "2"
