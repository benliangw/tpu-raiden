    - name: decode-b
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            spec:
              dnsPolicy: ClusterFirstWithHostNet
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x1
                cloud.google.com/gke-tpu-accelerator: tpu7x
              initContainers:
                - name: tpu-node-setup
                  image: busybox
                  securityContext:
                    privileged: true
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      sysctl -w vm.max_map_count=8388608
                      if [ -f /sys/module/vfio_iommu_type1/parameters/dma_entry_limit ]; then
                        echo 2000000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit
                        echo "Successfully increased dma_entry_limit"
                      fi
              containers:
              - name: vllm-tpu-decode
                image: us-central1-docker.pkg.dev/cloud-tpu-inference-test/vllm-tpu-rdna/vllm-torchtpu-benliangw_google_com:latest
                imagePullPolicy: Always
                command: ["/bin/bash", "-c"]
                args:
                - |
                  set -eo pipefail
                  : "${CDK_OUTPUT_DIR:=/tmp/cdk-outputs}"
                  export CDK_OUTPUT_DIR
                  mkdir -p "$CDK_OUTPUT_DIR"
                  export PYTHONUNBUFFERED=1

                  echo "===== Syncing dependencies to pyproject.toml ====="
                  # Keep the vllm== pin: this installs the pinned vLLM from
                  # PyPI, replacing the image's editable install of the NFS
                  # checkout at /root/cloud-devkit/vllm (which can drift from
                  # the version the torchtpu-vllm code expects). Only the
                  # torch-tpu pin is stripped; it is installed from a wheel
                  # below.
                  mkdir -p /tmp/depsync
                  sed -E '/"torch-tpu==/d' /root/torchtpu-vllm/pyproject.toml > /tmp/depsync/pyproject.toml
                  uv pip install --system -r /tmp/depsync/pyproject.toml --index-url https://pypi.org/simple


                  # Pinned tpu-raiden build; serves both raiden control
                  # planes in this pod.
                  uv pip install --system --no-deps \
                    "$RAIDEN_WHEEL"
                  python3 -c "from tpu_raiden.rpc.raiden_controller import RaidenController, RaidenControllerServer" \
                    || { echo "RESULT: FAIL (raiden import)"; exit 1; }

                  export PYTHONPATH=/root/torchtpu-vllm/src:/root/torchtpu-vllm:${PYTHONPATH:-}

                  python3 -c 'from tpu_raiden.api.torch import torch_tpu_common_loader as tl; tl.load_torch_tpu_common(); from tpu_raiden.frameworks.torch import _tpu_raiden_torch as trt; S = trt.KVCacheStore; assert hasattr(S, "num_registered_workers"), "raiden wheel too old (missing num_registered_workers)"; import vllm_torchtpu.offload.raiden_connector as rc; assert hasattr(rc, "TPURaidenOffloadingConnector"); print("V2 preflight OK")' \
                    || { echo "RESULT: FAIL (V2 preflight)"; exit 1; }

                  # Two raiden control planes coexist in this pod (disagg
                  # controller + offload store controller); without this,
                  # ControllerServer is a process-wide singleton that
                  # silently reuses the first bound port.
                  export RAIDEN_DISABLE_SINGLETON_WORKER=1

                  export VLLM_HOST_IP="${JS_NAME}-decode-b-0-0.${JS_NAME}"
                  NS="${JS_NAME//[^a-zA-Z0-9_]/_}"
                  export TPU_KV_TRANSFER_NAMESPACE="${NS}_decode_b"
                  export TPU_RAIDEN_JOB_NAME=decode_b
                  export TPU_RAIDEN_ENGINE_ID="${JS_NAME}-decode-b-engine"
                  export TPU_RAIDEN_CONTROLLER_ADDRESS="${VLLM_HOST_IP}:${CONTROLLER_PORT}"

                  echo "===== Pre-downloading $MODEL snapshot ====="
                  DL_OK=""
                  for i in $(seq 1 30); do
                    if python3 -c "import os; from huggingface_hub import snapshot_download; snapshot_download(os.environ['MODEL'])"; then
                      DL_OK=1; break
                    fi
                    echo "snapshot_download failed (attempt $i/30); retrying in 60s"
                    sleep 60
                  done
                  [ -n "$DL_OK" ] || { echo "RESULT: FAIL (model snapshot download)"; exit 1; }
                  export HF_HUB_OFFLINE=1

                  echo "===== Starting Raiden controller on :${CONTROLLER_PORT} ====="
                  cat > /tmp/raiden_controller.py <<'PYEOF'
                  import argparse, json, logging, os, signal, threading, time
                  from pathlib import Path
                  from tpu_raiden.rpc.raiden_controller import RaidenController, RaidenControllerServer

                  parser = argparse.ArgumentParser()
                  parser.add_argument("--port", type=int, required=True)
                  parser.add_argument("--advertise-host", required=True)
                  parser.add_argument("--request-registry-ttl-s", type=float, default=600.0)
                  parser.add_argument("--ready-file", type=Path, required=True)
                  args = parser.parse_args()

                  logging.basicConfig(level=logging.INFO,
                                      format="%(asctime)s %(levelname)s %(message)s",
                                      force=True)
                  stopping = threading.Event()
                  signal.signal(signal.SIGINT, lambda *_: stopping.set())
                  signal.signal(signal.SIGTERM, lambda *_: stopping.set())

                  controller = RaidenController(port=args.port,
                                                request_registry_ttl_s=args.request_registry_ttl_s)
                  server = RaidenControllerServer(controller)
                  server.start()
                  payload = {
                      "schema_version": 1,
                      "event": "raiden_controller_ready",
                      "pid": os.getpid(),
                      "requested_port": args.port,
                      "port": server.port,
                      "advertise_host": args.advertise_host,
                      "address": f"{args.advertise_host}:{server.port}",
                      "request_registry_ttl_s": args.request_registry_ttl_s,
                      "time_unix_s": time.time(),
                  }
                  args.ready_file.parent.mkdir(parents=True, exist_ok=True)
                  tmp = args.ready_file.with_name(f".{args.ready_file.name}.{os.getpid()}.tmp")
                  tmp.write_text(json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8")
                  tmp.replace(args.ready_file)
                  print(json.dumps(payload, sort_keys=True), flush=True)
                  try:
                      while not stopping.wait(1.0):
                          pass
                  finally:
                      server.stop()
                  PYEOF
                  rm -f /tmp/controller.ready.json
                  python3 /tmp/raiden_controller.py \
                    --port "$CONTROLLER_PORT" \
                    --advertise-host "$VLLM_HOST_IP" \
                    --request-registry-ttl-s 600 \
                    --ready-file /tmp/controller.ready.json \
                    > "$CDK_OUTPUT_DIR/controller.log" 2>&1 &
                  CONTROLLER_PID=$!
                  for i in $(seq 1 200); do
                    [ -s /tmp/controller.ready.json ] && break
                    kill -0 "$CONTROLLER_PID" 2>/dev/null \
                      || { echo "RESULT: FAIL (controller exited)"; cat "$CDK_OUTPUT_DIR/controller.log"; exit 1; }
                    sleep 0.5
                  done
                  [ -s /tmp/controller.ready.json ] || { echo "RESULT: FAIL (controller not ready)"; exit 1; }
                  cat /tmp/controller.ready.json

                  COMPILATION_CONFIG='{"backend":"vllm_torchtpu.compilation.tpu_compiler.TpuCompilerAdaptor","compile_sizes":[4096],"inductor_compile_config":{"enable_auto_functionalized_v2":false,"size_asserts":false,"alignment_asserts":false,"scalar_asserts":false}}'

                  # Raiden must remain first for proxied-load arbitration.
                  # DP8 allocates one 8 GiB store per engine (64 GiB total);
                  # each engine binds its own offload controller at
                  # OFFLOAD_CONTROLLER_PORT + dp_local_rank (47800-47807).
                  KV_TRANSFER_CONFIG='{"kv_connector":"TPUMultiConnector","kv_connector_module_path":"vllm_torchtpu.distributed.kv_transfer.tpu_multi_connector","kv_role":"kv_consumer","kv_connector_extra_config":{"connectors":[{"kv_connector":"TPURaidenConnector","kv_connector_module_path":"vllm_torchtpu.distributed.kv_transfer.tpu_connector","kv_role":"kv_consumer","kv_port":14579},{"kv_connector":"TPURaidenOffloadingConnector","kv_connector_module_path":"vllm_torchtpu.offload.raiden_connector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":8589934592,"raiden_controller_port":'"$OFFLOAD_CONTROLLER_PORT"'}}]}}'

                  # The proxy runs in another pod, so bind 0.0.0.0.
                  # Align-mode hybrid caching needs 16 request blocks plus
                  # six grouping/layout blocks at max_model_len=65536.
                  echo "===== Starting Qwen3.5 DP8 decode node (disagg+offload) ====="
                  exec vllm serve \
                    "$MODEL" \
                    --served-model-name "$SERVED_MODEL" \
                    --trust-remote-code \
                    --seed 42 \
                    --max-model-len 65536 \
                    --enable-expert-parallel \
