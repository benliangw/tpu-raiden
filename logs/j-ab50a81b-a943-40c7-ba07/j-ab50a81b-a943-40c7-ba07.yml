                  cat /tmp/controller.ready.json

                  COMPILATION_CONFIG='{"backend":"vllm_torchtpu.compilation.tpu_compiler.TpuCompilerAdaptor","compile_sizes":[4352],"inductor_compile_config":{"enable_auto_functionalized_v2":false,"size_asserts":false,"alignment_asserts":false,"scalar_asserts":false}}'

                  # Raiden must remain first for proxied-load arbitration.
                  # DP8 allocates one 8 GiB host pool per engine (64 GiB total).
