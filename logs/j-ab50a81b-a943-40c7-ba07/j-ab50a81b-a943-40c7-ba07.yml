# ---------------------------------------------------------------------------
# A/B workload with two completion gates:
#   - correctness checks cold/warm/proxy equivalence, deterministic eviction
#     churn, and a post-eviction replay of a known-answer prompt.
#   - eval revisits distinct many-shot GSM8K prefixes that exceed one PCP8
#     scheduler block. A conventional 25-shot GSM8K prompt is shorter than
#     the 34816-token hash block and cannot exercise the offload tier. The
#     eval pod runs that same seed/revisit shape a second time through
#     lm_eval, at a few-shot count sized past one block, so the job also
#     reports exact_match strict-match / flexible-extract.
#
# Pool sizing:
#   - prefill --num-gpu-blocks-override 128 -> 1,114,112 tokens
#     (16 x 2 scheduler blocks of 34816), matching --max-num-seqs 16.
#   - decode  --num-gpu-blocks-override 262 -> 16 request blocks per sequence
#     x 16 sequences + 6 grouping/layout blocks, also 1,114,112 tokens,
#     matching the prefill pool.
#   - CORRECTNESS_DOCS 24 / LC_DOCS 48: at ~35k tokens per doc (one full
#     34816-token block plus a tail) both working sets overflow the pool's
#     32 scheduler blocks, so every revisit is served after HBM eviction and
#     the A/B keeps its signal.
# Both overrides stay below the ~452 blocks the engine sizes at
# gpu_memory_utilization=0.9 (see "Overriding num_gpu_blocks=452" in the
# engine log), which is what makes them safe.
# ---------------------------------------------------------------------------
# Qwen3.5-397B-A17B-FP8 disaggregated serving with CPU KV offloading.
#
# Topology:
#   - prefill: PCP8/TP1 on one 8-device tpu7x host
#   - decode:  DP8/TP1 on a second 8-device tpu7x host
#   - transfer: Raiden Stage-3 through TPURaidenConnector
#   - offload: TPUCPUOffloadingSpec on both engines
#
# TPUMultiConnector children must remain ordered as
# [TPURaidenConnector, OffloadingConnector], so Raiden claims proxied decode
# requests before the local offload tier. Configure each offload child with
# cpu_bytes_to_use; --kv-offloading-size would replace the multi-connector
# configuration.
#
# Prefix caching uses mamba_cache_mode=align. On PCP8, one prefill scheduler
# block is 4352 * 8 = 34816 tokens, so only ~35k+-prefix workloads can hit
# the offload tier. The correctness and eval pods gate completion. Keep
# client concurrency within the 128-block prefill budget so abandoned Raiden
# sends cannot exhaust the pool.
#
# A/B analysis vs qwen35-397b-disagg-baseline.yml: in the eval pod's revisit pass
# server_ttft/prefill_avg collapse and ext_hit_pct approaches 100 only in this
# leg, while the baseline leg's revisit ~= its seed. Nothing is collected from
# CDK_OUTPUT_DIR — it is pod-local and dies with the pod — so the pod logs are
# the only artifact, and neither job compares itself against the other.
# Note: the decode-side offload tier only ever *saves* in this workload
# (Raiden wins arbitration for proxied requests), so its cost shows up in
# seed-pass parity, but no decode-restore path is exercised.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: vllm-qwen35-397b-disagg-offloading
spec:
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - correctness
      - eval
  ttlSecondsAfterFinished: 600
  replicatedJobs:
    # ---------------------------------------------------------
    # PREFILL (PCP8) + PROXY
    # ---------------------------------------------------------
    - name: prefill
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            spec:
              dnsPolicy: ClusterFirstWithHostNet
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x1
                cloud.google.com/gke-tpu-accelerator: tpu7x
              initContainers:
                - name: tpu-node-setup
                  image: busybox
                  securityContext:
                    privileged: true
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      sysctl -w vm.max_map_count=8388608
                      if [ -f /sys/module/vfio_iommu_type1/parameters/dma_entry_limit ]; then
                        echo 2000000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit
                        echo "Successfully increased dma_entry_limit"
                      fi
              containers:
              - name: vllm-tpu-prefill
                image: us-central1-docker.pkg.dev/cloud-tpu-inference-test/vllm-tpu-rdna/vllm-torchtpu-benliangw_google_com:latest
                imagePullPolicy: Always
                command: ["/bin/bash", "-c"]
                args:
                - |
                  set -eo pipefail
                  : "${CDK_OUTPUT_DIR:=/tmp/cdk-outputs}"
                  export CDK_OUTPUT_DIR
                  mkdir -p "$CDK_OUTPUT_DIR"
                  export PYTHONUNBUFFERED=1

                  echo "===== Syncing dependencies to pyproject.toml ====="
                  # Keep the vllm== pin: this installs the pinned vLLM from
                  # PyPI, replacing the image's editable install of the NFS
                  # checkout at /root/cloud-devkit/vllm (which can drift from
                  # the version the torchtpu-vllm code expects). Only the
                  # torch-tpu pin is stripped; it is installed from a wheel
                  # below.
                  mkdir -p /tmp/depsync
                  sed -E '/"torch-tpu==/d' /root/torchtpu-vllm/pyproject.toml > /tmp/depsync/pyproject.toml
                  uv pip install --system -r /tmp/depsync/pyproject.toml --index-url https://pypi.org/simple

                  TT_VER=$(sed -nE 's/^[[:space:]]*"torch-tpu==([^"]+)".*/\1/p' /root/torchtpu-vllm/pyproject.toml | head -1)
                  if [ -z "$TT_VER" ]; then
                    echo "WARN: no torch-tpu pin in pyproject.toml; keeping the image's torch_tpu"
                  else
                    TT_WHL=$(ls /root/wheels/torch_tpu-${TT_VER}-*.whl 2>/dev/null | head -1 || true)
                    if [ -n "$TT_WHL" ]; then
                      uv pip install --system --no-deps "$TT_WHL"
                    else
                      TOKEN=$(curl -sf -H "Metadata-Flavor: Google" \
                        "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" \
                        | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
                      uv pip install --system --no-deps "torch-tpu==${TT_VER}" \
                        --index-url "https://oauth2accesstoken:${TOKEN}@us-python.pkg.dev/ml-oss-artifacts-transient/torch-tpu-virtual-registry/simple/"
                    fi
                  fi

                  # Pinned tpu-raiden build from upstream main commit
                  # 0e09976 (no local tpu-raiden changes).
                  uv pip install --system --no-deps \
                    "/root/wheels/tpu_raiden_torch-0.0.1.dev20260723161528-1_head_0e09976-cp312-cp312-manylinux_2_31_x86_64.whl"
                  python3 -c "from tpu_raiden.rpc.raiden_controller import RaidenController, RaidenControllerServer" \
                    || { echo "RESULT: FAIL (raiden import)"; exit 1; }

                  export PYTHONPATH=/root/torchtpu-vllm/src:/root/torchtpu-vllm:${PYTHONPATH:-}

                  export VLLM_HOST_IP="${JS_NAME}-prefill-0-0.${JS_NAME}"
                  NS="${JS_NAME//[^a-zA-Z0-9_]/_}"
                  export TPU_KV_TRANSFER_NAMESPACE="${NS}_prefill"
                  export TPU_RAIDEN_JOB_NAME=prefill
                  export TPU_RAIDEN_ENGINE_ID="${JS_NAME}-prefill-engine"
                  export TPU_RAIDEN_CONTROLLER_ADDRESS="${VLLM_HOST_IP}:${CONTROLLER_PORT}"

                  echo "===== Pre-downloading $MODEL snapshot ====="
                  DL_OK=""
                  for i in $(seq 1 30); do
                    if python3 -c "import os; from huggingface_hub import snapshot_download; snapshot_download(os.environ['MODEL'])"; then
                      DL_OK=1; break
                    fi
                    echo "snapshot_download failed (attempt $i/30); retrying in 60s"
                    sleep 60
                  done
                  [ -n "$DL_OK" ] || { echo "RESULT: FAIL (model snapshot download)"; exit 1; }
                  export HF_HUB_OFFLINE=1

                  echo "===== Starting Raiden controller on :${CONTROLLER_PORT} ====="
                  cat > /tmp/raiden_controller.py <<'PYEOF'
                  import argparse, json, logging, os, signal, threading, time
                  from pathlib import Path
                  from tpu_raiden.rpc.raiden_controller import RaidenController, RaidenControllerServer

                  parser = argparse.ArgumentParser()
                  parser.add_argument("--port", type=int, required=True)
                  parser.add_argument("--advertise-host", required=True)
                  parser.add_argument("--request-registry-ttl-s", type=float, default=600.0)
                  parser.add_argument("--ready-file", type=Path, required=True)
                  args = parser.parse_args()

                  logging.basicConfig(level=logging.INFO,
                                      format="%(asctime)s %(levelname)s %(message)s",
                                      force=True)
                  stopping = threading.Event()
                  signal.signal(signal.SIGINT, lambda *_: stopping.set())
                  signal.signal(signal.SIGTERM, lambda *_: stopping.set())

                  controller = RaidenController(port=args.port,
                                                request_registry_ttl_s=args.request_registry_ttl_s)
                  server = RaidenControllerServer(controller)
                  server.start()
                  payload = {
                      "schema_version": 1,
                      "event": "raiden_controller_ready",
                      "pid": os.getpid(),
                      "requested_port": args.port,
                      "port": server.port,
                      "advertise_host": args.advertise_host,
                      "address": f"{args.advertise_host}:{server.port}",
                      "request_registry_ttl_s": args.request_registry_ttl_s,
                      "time_unix_s": time.time(),
                  }
                  args.ready_file.parent.mkdir(parents=True, exist_ok=True)
                  tmp = args.ready_file.with_name(f".{args.ready_file.name}.{os.getpid()}.tmp")
                  tmp.write_text(json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8")
                  tmp.replace(args.ready_file)
                  print(json.dumps(payload, sort_keys=True), flush=True)
                  try:
                      while not stopping.wait(1.0):
                          pass
                  finally:
                      server.stop()
                  PYEOF
                  rm -f /tmp/controller.ready.json
                  python3 /tmp/raiden_controller.py \
                    --port "$CONTROLLER_PORT" \
                    --advertise-host "$VLLM_HOST_IP" \
                    --request-registry-ttl-s 600 \
                    --ready-file /tmp/controller.ready.json \
                    > "$CDK_OUTPUT_DIR/controller.log" 2>&1 &
                  CONTROLLER_PID=$!
                  for i in $(seq 1 200); do
                    [ -s /tmp/controller.ready.json ] && break
                    kill -0 "$CONTROLLER_PID" 2>/dev/null \
                      || { echo "RESULT: FAIL (controller exited)"; cat "$CDK_OUTPUT_DIR/controller.log"; exit 1; }
                    sleep 0.5
                  done
                  [ -s /tmp/controller.ready.json ] || { echo "RESULT: FAIL (controller not ready)"; exit 1; }
                  cat /tmp/controller.ready.json

                  COMPILATION_CONFIG='{"backend":"vllm_torchtpu.compilation.tpu_compiler.TpuCompilerAdaptor","compile_sizes":[4352],"inductor_compile_config":{"enable_auto_functionalized_v2":false,"size_asserts":false,"alignment_asserts":false,"scalar_asserts":false}}'

                  # Raiden must remain first for load arbitration. PCP8 is one
                  # engine, so its 256 GiB host pool is divided across workers.
                  # --kv-offloading-size would replace this child config.
                  KV_TRANSFER_CONFIG='{"kv_connector":"TPUMultiConnector","kv_connector_module_path":"vllm_torchtpu.distributed.kv_transfer.tpu_multi_connector","kv_role":"kv_producer","kv_connector_extra_config":{"connectors":[{"kv_connector":"TPURaidenConnector","kv_connector_module_path":"vllm_torchtpu.distributed.kv_transfer.tpu_connector","kv_role":"kv_producer","kv_port":14579},{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"spec_name":"TPUCPUOffloadingSpec","spec_module_path":"vllm_torchtpu.offload.cpu_tpu","cpu_bytes_to_use":274877906944}}]}}'

                  echo "===== Starting Qwen3.5 PCP8 prefill node (disagg+offload) ====="
                  exec vllm serve \
                    "$MODEL" \
                    --served-model-name "$SERVED_MODEL" \
                    --trust-remote-code \
                    --seed 42 \
                    --max-model-len 65536 \
                    --enable-expert-parallel \
                    --disable-custom-all-reduce \
                    --gpu-memory-utilization 0.9 \
                    --kv-cache-dtype fp8 \
                    --language-model-only \
                    --max-num-batched-tokens 4352 \
                    --max-num-seqs 16 \
                    --no-disable-hybrid-kv-cache-manager \
                    --attention-backend CUSTOM \
                    --mamba-cache-mode align \
                    --enable-prompt-tokens-details \
                    --no-enable-log-requests \
                    --compilation-config "$COMPILATION_CONFIG" \
                    --enable-prefix-caching \
                    --no-async-scheduling \
                    --block-size 4352 \
                    --tensor-parallel-size 1 \
                    --host 0.0.0.0 \
                    --port 8000 \
                    --num-gpu-blocks-override 128 \
                    --prefill-context-parallel-size 8 \
                    --cp-kv-cache-interleave-size 256 \
                    --kv-transfer-config "$KV_TRANSFER_CONFIG" \
                    2>&1 | tee "$CDK_OUTPUT_DIR/server.log"
                env:
                  - name: JS_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
                  - name: HF_HOME
                    value: "/vllm-cache"
                  - name: HF_HUB_OFFLINE
                    value: "1"
                  - name: MODEL
                    value: "Qwen/Qwen3.5-397B-A17B-FP8"
                  - name: SERVED_MODEL
                    value: "Qwen3.5-397B-A17B-FP8"
                  - name: CONTROLLER_PORT
                    value: "27000"
                  - name: VLLM_LOGGING_LEVEL
                    value: "INFO"
                  - name: HF_HUB_DISABLE_XET
                    value: "1"
                  # --- device / topology (8 devices on one 2x2x1 tpu7x host) ---
                  - name: JAX_PLATFORMS
                    value: "tpu,cpu"
                  - name: PJRT_DEVICE
                    value: TPU
                  - name: TPU_BACKEND_TYPE
                    value: "jax"
                  - name: VLLM_TARGET_DEVICE
                    value: "tpu"
                  - name: TPU_TOPOLOGY
                    value: "2x2x1"
                  - name: TPU_CHIPS_PER_HOST_BOUNDS
                    value: "2,2,1"
                  - name: TPU_HOST_BOUNDS
                    value: "1,1,1"
                  - name: TPU_LIBRARY_PATH
                    value: ""
                  - name: MEGASCALE_NUM_SLICES
                    value: ""
                  - name: MEGASCALE_SLICE_ID
                    value: ""
                  - name: TPU_PROCESS_ADDRESSES
                    value: ""
                  - name: TPU_WORKER_HOSTNAMES
                    value: ""
                  - name: TPU_PROCESS_PORT
                    value: ""
                  - name: MEGASCALE_COORDINATOR_ADDRESS
                    value: ""
                  - name: MEGASCALE_PORT
                    value: ""
                  # --- model / kernel config (from the live-pair script) ---
                  - name: MODEL_IMPL_TYPE
                    value: "vllm"
                  - name: NEW_MODEL_DESIGN
                    value: "0"
                  - name: SKIP_JAX_PRECOMPILE
                    value: "1"
                  - name: VLLM_XLA_CHECK_RECOMPILATION
                    value: "0"
                  - name: USE_MOE_SPARSE_CORE
                    value: "0"
                  - name: TPUMISC_HMA_CHECKSUM_TRACE
                    value: "0"
                  - name: TPU_GDN_CONV_STATE_TILE_PAD
                    value: "1"
                  - name: XLA_PYTHON_CLIENT_PREALLOCATE
                    value: "false"
                  - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
                    value: "1"
                  - name: USE_BATCHED_RPA_KERNEL
                    value: "1"
                  - name: RAGGED_GATED_DELTA_RULE_IMPL
                    value: "chunked_kernel_v3_pd"
                  - name: ONEHOT_MOE_PERMUTE_THRESHOLD
                    value: "1024"
                  - name: TPU_RAGGED_GATHER_REDUCE_IMPL
                    value: "fallback"
                  - name: TPU_RAGGED_GATHER_IMPL
                    value: "fallback"
                  - name: LIBTPU_INIT_ARGS
                    value: "--xla_tpu_scoped_vmem_limit_kib=65536 --xla_tpu_enable_latency_hiding_scheduler=false"
                  # libtpu 0.0.43 can take longer than the 120 s default to
                  # bootstrap the PCP8 LOCAL_RANK remap probe.
                  - name: TPU_PCP_REMAP_PROBE_TIMEOUT_S
                    value: "600"
                  # Include model load, KV-cache profiling, and warmup.
                  - name: VLLM_ENGINE_READY_TIMEOUT_S
                    value: "1800"
                  - name: TORCH_TPU_INTERNAL_TIER2_COMPILATION_CACHE
                    value: "disabled"
                  # --- Raiden KV transfer (from the live-pair script) ---
                  - name: TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL
                    value: "1"
                  - name: TPU_USE_RAIDEN_KV_CACHE_MANAGER
                    value: "1"
                  - name: TPU_RAIDEN_QWEN35_ADMISSION
                    value: "1"
                  - name: TPU_KV_RESHARD_TRANSPORT
                    value: "raiden"
                  # Producer-side Stage-3 byte-span lowering needs the
                  # destination page geometry; it cannot read the decoder's
                  # block_size. Must track decode's --block-size 4352.
                  - name: TPU_KV_RESHARD_DST_PAGE_TOKENS
                    value: "4352"
                  - name: TPU_RAIDEN_TRANSFER_PARALLELISM
                    value: "8"
                  - name: TPU_ENABLE_D2H_TRANSFER
                    value: "1"
                  - name: TPU_HMA_D2H_COPY_IMPL
                    value: "device_put"
                  - name: TPU_HMA_MIN_DONE_RECVING_BATCH
                    value: "1"
                  - name: TPU_HMA_MAX_DONE_RECVING_BATCH
                    value: "1"
                  - name: TPU_HMA_MAX_INFLIGHT_D2H_SENDS
                    value: "1"
                  - name: TPU_HMA_MAX_INFLIGHT_PULLS
                    value: "8"
                  - name: TPU_MAX_HOST_KV_BUFFER_SIZE
                    value: "64"
                  # Exceeds measured claim latency while bounding how long an
                  # abandoned request can pin the prefill block pool.
                  - name: TPU_P2P_WAIT_PULL_TIMEOUT
                    value: "300"
                  - name: TPU_KV_SHM_POOL_GB
                    value: "8"
                  - name: TPU_KV_TRANSFER_PORT
                    value: "9100"
                  - name: TPU_SIDE_CHANNEL_PORT
                    value: "9600"
                  # --- KV offloading (raiden D2H/H2D backend) ---
                  - name: VLLM_TPU_OFFLOAD_RAIDEN
                    value: "1"
                volumeMounts:
                  - name: hf-token-volume
                    mountPath: /root/.cache/huggingface/token
                    subPath: token
                    readOnly: true
                  - name: vllm-shared-cache
                    mountPath: /vllm-cache
                    readOnly: true
                  - name: dshm
                    mountPath: /dev/shm
                  - name: torchtpu-vllm-nfs
                    mountPath: /root/torchtpu-vllm
                  - name: vllm-nfs
                    mountPath: /root/cloud-devkit/vllm
                  - name: wheels-nfs
                    mountPath: /root/wheels
                    readOnly: true
                securityContext:
                  privileged: true
                  capabilities:
                    add:
                    - IPC_LOCK
                resources:
                  limits:
                    google.com/tpu: "4"
                    memory: "850Gi"
                    cpu: "200"
                  requests:
                    google.com/tpu: "4"
                    memory: "850Gi"
                    cpu: "200"
                ports:
                  - containerPort: 8000

              - name: vllm-tpu-proxy
                image: us-central1-docker.pkg.dev/cloud-tpu-inference-test/vllm-tpu-rdna/vllm-torchtpu-benliangw_google_com:latest
                imagePullPolicy: Always
                command: ["/bin/bash", "-c"]
                args:
                  - |
                    PREFILLER_DNS="${JS_NAME}-prefill-0-0.${JS_NAME}"
                    DECODER_DNS="${JS_NAME}-decode-0-0.${JS_NAME}"

                    python3 /root/torchtpu-vllm/examples/disagg/toy_proxy_server.py \
                      --host 0.0.0.0 \
                      --port 10000 \
                      --prefiller-host $PREFILLER_DNS \
                      --prefiller-port 8000 \
                      --decoder-host $DECODER_DNS \
                      --decoder-port 7200
                env:
                - name: JS_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
                volumeMounts:
                  - name: torchtpu-vllm-nfs
                    mountPath: /root/torchtpu-vllm
                    readOnly: true
                ports:
                - containerPort: 10000
                resources:
                  requests: { cpu: "8", memory: "16Gi" }
                  limits: { cpu: "16", memory: "32Gi" }

              volumes:
              - name: dshm
                emptyDir:
                  medium: Memory
              - name: hf-token-volume
                secret:
                  secretName: vllm-hf-token
                  items:
                  - key: HF_TOKEN
                    path: token
              - name: vllm-shared-cache
                persistentVolumeClaim:
                  claimName: vllm-shared-cache-rox-pvc
                  readOnly: true
              - name: torchtpu-vllm-nfs
                nfs:
                  server: 10.225.237.178
                  path: /workspace/vllm-torchtpu
              - name: vllm-nfs
                nfs:
                  server: 10.225.237.178
                  path: /workspace/vllm
              - name: wheels-nfs
                nfs:
                  server: 10.225.237.178
                  path: /workspace/wheels

    # ---------------------------------------------------------
    # DECODE (DP8)
    # ---------------------------------------------------------
    - name: decode
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            spec:
              dnsPolicy: ClusterFirstWithHostNet
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x1
                cloud.google.com/gke-tpu-accelerator: tpu7x
              initContainers:
                - name: tpu-node-setup
                  image: busybox
                  securityContext:
                    privileged: true
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      sysctl -w vm.max_map_count=8388608
                      if [ -f /sys/module/vfio_iommu_type1/parameters/dma_entry_limit ]; then
                        echo 2000000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit
                        echo "Successfully increased dma_entry_limit"
                      fi
              containers:
              - name: vllm-tpu-decode
                image: us-central1-docker.pkg.dev/cloud-tpu-inference-test/vllm-tpu-rdna/vllm-torchtpu-benliangw_google_com:latest
                imagePullPolicy: Always
                command: ["/bin/bash", "-c"]
                args:
                - |
                  set -eo pipefail
                  : "${CDK_OUTPUT_DIR:=/tmp/cdk-outputs}"
                  export CDK_OUTPUT_DIR
                  mkdir -p "$CDK_OUTPUT_DIR"
                  export PYTHONUNBUFFERED=1

                  echo "===== Syncing dependencies to pyproject.toml ====="
                  # Keep the vllm== pin: this installs the pinned vLLM from
                  # PyPI, replacing the image's editable install of the NFS
                  # checkout at /root/cloud-devkit/vllm (which can drift from
                  # the version the torchtpu-vllm code expects). Only the
                  # torch-tpu pin is stripped; it is installed from a wheel
                  # below.
                  mkdir -p /tmp/depsync
                  sed -E '/"torch-tpu==/d' /root/torchtpu-vllm/pyproject.toml > /tmp/depsync/pyproject.toml
                  uv pip install --system -r /tmp/depsync/pyproject.toml --index-url https://pypi.org/simple

                  TT_VER=$(sed -nE 's/^[[:space:]]*"torch-tpu==([^"]+)".*/\1/p' /root/torchtpu-vllm/pyproject.toml | head -1)
                  if [ -z "$TT_VER" ]; then
                    echo "WARN: no torch-tpu pin in pyproject.toml; keeping the image's torch_tpu"
                  else
                    TT_WHL=$(ls /root/wheels/torch_tpu-${TT_VER}-*.whl 2>/dev/null | head -1 || true)
                    if [ -n "$TT_WHL" ]; then
                      uv pip install --system --no-deps "$TT_WHL"
                    else
                      TOKEN=$(curl -sf -H "Metadata-Flavor: Google" \
                        "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" \
                        | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
                      uv pip install --system --no-deps "torch-tpu==${TT_VER}" \
                        --index-url "https://oauth2accesstoken:${TOKEN}@us-python.pkg.dev/ml-oss-artifacts-transient/torch-tpu-virtual-registry/simple/"
                    fi
                  fi

                  # Pinned tpu-raiden build from upstream main commit
                  # 0e09976 (no local tpu-raiden changes).
                  uv pip install --system --no-deps \
