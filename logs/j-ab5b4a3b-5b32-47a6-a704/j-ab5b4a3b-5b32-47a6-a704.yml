              containers:
                - name: vllm-server
                  image: "us-central1-docker.pkg.dev/cloud-tpu-inference-test/vllm-tpu-rdna/torchtpu-vllm:yinlin_google_com_block-major-raiden-t211b-syncfix"
                  imagePullPolicy: Always
                  env:
                    - name: REPLICA
                      value: "b"
                    # Must match replica A's seed — see the comment there.
                    - name: PYTHONHASHSEED
                      value: "0"
                    # Key-space diagnostic — see replica A's comment.
                    - name: VLLM_TPU_OFFLOAD_DEBUG_KEYS
                      value: "1"
                    - name: JS_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
                    - name: MY_POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: MODEL
                      value: "Qwen/Qwen3-32B"
                    - name: PORT
                      value: "8000"
                    - name: GPU_MEM_UTIL
                      value: "0.3"
                    # Must hold pass 1's whole working set: 8 docs x 264
                    # 128-token chunks = 2112 blocks x 32 MiB = 66 GiB. At
                    # 40 GiB (1280 blocks) A's own saves LRU-evict and
                    # unregister docs 0-3 before the replay, so exactly
                    # those replays miss (j-b7ed5cd0: docs 4-7 hit with
                    # full cached_tokens=33792, docs 0-3 got 0). 80 GiB =
                    # 2560 blocks, ~20% slack.
                    - name: KV_OFFLOADING_SIZE
                      value: "80"
                    - name: RAIDEN_CONTROLLER_PORT
                      value: "47800"
                    - name: REGISTRY_PORT
                      value: "48500"
                    - name: ORCH_PORT
                      value: "48600"
                    - name: RAIDEN_WHL
                      value: "/root/wheels/tpu_raiden_torch-0.0.1.dev20260803223638-1_raiden_controller_72fb11f-cp312-cp312-manylinux_2_31_x86_64.whl"
                    - name: TPU_TOPOLOGY
                      value: "2x2x1"
                    - name: TPU_CHIPS_PER_HOST_BOUNDS
                      value: "2,2,1"
                    - name: TPU_HOST_BOUNDS
                      value: "1,1,1"
                    - name: TPU_STDERR_LOG_LEVEL
                      value: "0"
                    - name: VLLM_LOGGING_LEVEL
                      value: "INFO"
                    - name: VLLM_TPU_BLOCK_MAJOR_KV
                      value: "1"
                    # Explicitly disable megascale (single-host)
                    - name: MEGASCALE_NUM_SLICES
                      value: ""
                    - name: MEGASCALE_SLICE_ID
                      value: ""
                    - name: TPU_PROCESS_ADDRESSES
                      value: ""
                    - name: TPU_WORKER_HOSTNAMES
                      value: ""
                    - name: TPU_PROCESS_PORT
                      value: ""
                    - name: MEGASCALE_COORDINATOR_ADDRESS
                      value: ""
                    - name: MEGASCALE_PORT
                      value: ""
                  volumeMounts:
                    - name: hf-token-volume
                      mountPath: /root/.cache/huggingface/token
                      subPath: token
                      readOnly: true
                    - name: huggingface-storage
                      mountPath: /root/.cache/huggingface/
                    - name: dshm
                      mountPath: /dev/shm
                    - name: torchtpu-vllm-nfs
                      mountPath: /root/torchtpu-vllm
                    - name: wheels-nfs
                      mountPath: /root/wheels
                      readOnly: true
                  command: [ "/bin/bash", "-c" ]
                  args:
                    - |
                      set -eo pipefail
                      : "${CDK_OUTPUT_DIR:=/tmp/cdk-outputs}"
                      export CDK_OUTPUT_DIR
                      mkdir -p "$CDK_OUTPUT_DIR"
                      export PYTHONUNBUFFERED=1

                      # ---- Inject the V2 code: branch source + wheel ----
                      echo "===== Syncing dependencies to pyproject.toml ====="
                      mkdir -p /tmp/depsync
                      sed -E '/"torch-tpu==/d' /root/torchtpu-vllm/pyproject.toml > /tmp/depsync/pyproject.toml
                      uv pip install --system -r /tmp/depsync/pyproject.toml --index-url https://pypi.org/simple

                      [ -n "$RAIDEN_WHL" ] && [ -f "$RAIDEN_WHL" ] || { echo "RESULT: FAIL (no tpu_raiden_torch wheel in /root/wheels)"; exit 1; }
                      echo "Installing raiden wheel: $RAIDEN_WHL"
                      uv pip install --system --no-deps "$RAIDEN_WHL"

                      export PYTHONPATH=/root/torchtpu-vllm/src:/root/torchtpu-vllm:${PYTHONPATH:-}

                      # Phase-4 preflight: the wheel must ship the remote-read
