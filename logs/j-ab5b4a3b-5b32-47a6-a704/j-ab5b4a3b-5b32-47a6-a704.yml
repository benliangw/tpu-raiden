                  resources:
                    limits:
                      google.com/tpu: 4
                      memory: "900Gi"
                      cpu: "16"
                    requests:
                      google.com/tpu: 4
                      memory: "900Gi"
                      cpu: "16"

    # check: warm replica A, replay on replica B, compare byte-for-byte and
    # report the pass-2 vs cold TTFT gap.
    - name: check
      replicas: 1
      template:
        spec:
          ttlSecondsAfterFinished: 900
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: xreplica-check
                  image: vllm/vllm-tpu:nightly
                  imagePullPolicy: Always
                  env:
                    - name: JS_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
                    - name: MODEL
                      value: "Qwen/Qwen3-32B"
                    - name: PORT
                      value: "8000"
                    - name: NUM_PROMPTS
                      value: "8"
                    # Words per prompt. Measured with the real Qwen3
                    # tokenizer: w{i}x{j} words with 4-digit j are ~6.8
                    # tokens each, so 5000 words = 33908 prompt tokens —
                    # inside Qwen3-32B's 40960 window with OUTPUT_LEN.
                    # 6000 was 40908, which 400'd at 40908 + 64 > 40960;
                    # re-measure before raising this.
                    - name: PROMPT_WORDS
                      value: "5000"
                    - name: OUTPUT_LEN
                      value: "64"
                    # Seconds between warming A and replaying on B, so the
                    # last saves commit and publish to the registry.
                    - name: PUBLISH_WAIT_S
                      value: "15"
                  command: [ "/bin/bash", "-c" ]
                  args:
                    - |
                      set -eo pipefail
                      : "${CDK_OUTPUT_DIR:=/tmp/cdk-outputs}"
                      export CDK_OUTPUT_DIR
                      mkdir -p "$CDK_OUTPUT_DIR"
                      export PYTHONUNBUFFERED=1

                      export HOST_A="${JS_NAME}-server-a-0-0.${JS_NAME}"
                      export HOST_B="${JS_NAME}-server-b-0-0.${JS_NAME}"
                      for host in "$HOST_A" "$HOST_B"; do
                        echo "Waiting for vLLM at http://${host}:${PORT}/health (up to 180 min)..."
                        waited=0
                        while ! curl -sf "http://${host}:${PORT}/health" >/dev/null 2>&1; do
                          if [ "$waited" -ge $((180 * 60)) ]; then
                            echo "RESULT: FAIL (${host} not ready)"; exit 1
                          fi
                          if [ "$waited" -gt 0 ] && [ $((waited % 60)) -eq 0 ]; then
                            echo "  ...still waiting for ${host} (${waited}s elapsed)"
                          fi
                          sleep 1; waited=$((waited + 1))
                        done
                        echo "${host} ready (${waited}s)"
                      done

                      python3 - <<'PYEOF' 2>&1 | tee "$CDK_OUTPUT_DIR/xreplica.log"
                      import json, os, sys, time, urllib.error, urllib.request

                      HOST_A = os.environ["HOST_A"]
                      HOST_B = os.environ["HOST_B"]
                      PORT = os.environ["PORT"]
                      MODEL = os.environ["MODEL"]
                      N = int(os.environ["NUM_PROMPTS"])
                      WORDS = int(os.environ["PROMPT_WORDS"])
                      OUT = int(os.environ["OUTPUT_LEN"])
                      PUBLISH_WAIT_S = float(os.environ["PUBLISH_WAIT_S"])

                      def prompt(tag, i):
                          # Deterministic, high-entropy, and distinct per (tag, i)
                          # so no two prompts share a prefix block.
                          head = f"[{tag}-{i:04d}] "
                          body = " ".join(f"w{i}x{j}" for j in range(WORDS))
                          return head + body + "\nSummarize the above in one line:"

                      def complete(host, text):
                          req = urllib.request.Request(
                              f"http://{host}:{PORT}/v1/completions",
                              data=json.dumps({
                                  "model": MODEL, "prompt": text,
                                  "max_tokens": OUT, "temperature": 0.0,
                                  "seed": 42, "ignore_eos": True,
                              }).encode(),
                              headers={"Content-Type": "application/json"})
                          t0 = time.time()
                          try:
                              with urllib.request.urlopen(req,
                                                          timeout=1800) as r:
                                  body = json.loads(r.read())
                          except urllib.error.HTTPError as e:
                              print(f"HTTP {e.code} from {host}: "
                                    f"{e.read().decode(errors='replace')[:500]}")
                              raise
                          usage = body.get("usage") or {}
                          details = usage.get("prompt_tokens_details") or {}
                          return (body["choices"][0]["text"],
                                  time.time() - t0,
                                  details.get("cached_tokens"))

                      prompts = [prompt("doc", i) for i in range(N)]

                      print(f"=== pass 1: warming replica A with {N} prompts, "
                            f"{WORDS} words each ===")
                      first = [complete(HOST_A, p) for p in prompts]
                      for i, (_, dt, cached) in enumerate(first):
                          print(f"  doc-{i:04d}: {dt:6.2f}s cached_tokens={cached}")

                      print(f"=== waiting {PUBLISH_WAIT_S:.0f}s for saves to "
                            f"commit and publish to the registry ===")
                      time.sleep(PUBLISH_WAIT_S)

                      print(f"=== pass 2: replaying the same {N} prompts on "
                            f"replica B (must arrive via read_remote) ===")
                      second = [complete(HOST_B, p) for p in prompts]
                      for i, (_, dt, cached) in enumerate(second):
                          print(f"  doc-{i:04d}: {dt:6.2f}s cached_tokens={cached}")

                      print(f"=== pass 3: {N} fresh prompts on replica B "
                            f"(cold-TTFT baseline) ===")
                      cold = [complete(HOST_B, prompt("cold", i)) for i in range(N)]
                      for i, (_, dt, cached) in enumerate(cold):
                          print(f"  cold-{i:04d}: {dt:6.2f}s cached_tokens={cached}")

                      # Byte equality is informational only (replicas are not
                      # byte-deterministic, vllm-torchtpu PR #62); the gated
                      # signal is immediate divergence — corrupt fetched KV
                      # garbles the continuation from the first tokens, while
                      # a benign token flip mid-rollout keeps a long common
                      # prefix.
                      EARLY_DIV_CHARS = 8
                      exact, early_div = 0, []
                      for i, ((a, _, _), (b, _, _)) in enumerate(zip(first, second)):
                          if a == b:
                              exact += 1
                              continue
                          n = min(len(a), len(b))
                          lcp = 0
                          while lcp < n and a[lcp] == b[lcp]:
                              lcp += 1
                          print(f"MISMATCH doc-{i:04d} lcp_chars={lcp}")
                          print(f"  replica A: {a[:200]!r}")
                          print(f"  replica B: {b[:200]!r}")
                          if lcp < EARLY_DIV_CHARS:
                              early_div.append(i)
                      print(f"pass 2: {exact}/{N} byte-identical, "
                            f"early_divergences={early_div}")

                      t_warm = sum(t for _, t, _ in second) / max(len(second), 1)
                      t_cold = sum(t for _, t, _ in cold) / max(len(cold), 1)
                      print(f"mean latency on B: remote-hit={t_warm:.2f}s "
                            f"cold={t_cold:.2f}s "
                            f"(speedup {t_cold / max(t_warm, 1e-9):.2f}x)")

                      # Hard: matching outputs alone prove nothing — plain
                      # recomputation reproduces them too. Every replayed
                      # prompt must report cached prompt tokens, or the gate
                      # never exercised read_remote at all.
                      missed = [i for i, (_, _, c) in enumerate(second) if not c]
                      # Latency stays a WARNING only: it is too noisy to gate on.
                      if t_warm >= t_cold:
                          print("WARNING: remote-hit latency is not below the cold "
                                "baseline — the sharing plane is not paying off. "
                                "Correctness still gates; investigate before "
                                "trusting the perf story.")

                      if len(early_div) > N // 2:
                          print(f"RESULT: FAIL ({len(early_div)}/{N} prompts diverge "
                                f"between replica A and replica B within the first "
                                f"{EARLY_DIV_CHARS} chars — fetched KV looks "
                                f"corrupt, not benignly nondeterministic: "
                                f"{early_div})")
                          sys.exit(1)
                      if missed:
                          for i in missed:
                              print(f"NO-HIT doc-{i:04d}: "
                                    f"cached_tokens={second[i][2]}")
                          print(f"RESULT: FAIL ({len(missed)}/{N} replayed prompts "
                                f"reported no cached prompt tokens — the replay "
                                f"did not arrive via read_remote: {missed}. Check "
                                f"replica B's server.log for read_remote activity "
                                f"and the registry pod's logs.)")
                          sys.exit(1)
                      print(f"RESULT: PASS ({exact}/{N} byte-identical, "
                            f"{len(early_div)} early divergences, cached-token "
                            f"evidence on all replays; remote-hit "
                            f"{t_cold / max(t_warm, 1e-9):.2f}x faster than cold)")
                      PYEOF
                  resources:
                    limits:
                      memory: "8Gi"
                      cpu: "2"
                    requests:
                      memory: "4Gi"
                      cpu: "1"
