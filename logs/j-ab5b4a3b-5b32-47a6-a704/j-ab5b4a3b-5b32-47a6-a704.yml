# OffloadingControllerV2 (raiden KVCacheStore) phase-4 CROSS-INSTANCE recipe.
#
# Two identical Qwen3-32B single-host replicas share one global registry: a
# prefix computed by replica A is a REMOTE hit on replica B, pulled P2P from
# A's host pool straight into B's HBM (read_remote). Shape per the design's
# §6 phase 4: 2 serving replicas + 1 CPU pod running global_registry_server
# and raiden_orchestrator_main + 1 check pod.
#
# The check job is the phase-4 gate:
#
#   pass 1 -> N distinct long prompts, greedy decode on replica A (warms the
#             store; saved blocks are published to the registry by raiden)
#   pass 2 -> the SAME N prompts on replica B; B never computed them, so
#             every prefix block must arrive via registry lookup +
#             read_remote. Outputs must not diverge from pass 1 almost
#             immediately (the corrupt-fetched-KV signature); full byte
#             equality is reported but NOT gated — two replicas are not
#             byte-deterministic on this stack (see vllm-torchtpu PR #62
#             evals), while benign divergence flips a token mid-rollout
#             and keeps a long common prefix.
#   pass 3 -> N FRESH prompts on replica B: the cold-TTFT baseline the
#             pass-2 latency is compared against (near-local TTFT is
#             reported, only correctness is a hard failure).
#
# Registry-down degradation and namespace mismatches are unit-tested; this
# job proves the happy path end to end on real TPUs.
#
# Deploy prerequisites (on the remote VM, after the raiden wheel build):
#   cp bazel-bin/tpu_raiden/kv_cache/global_registry/global_registry_server \
#      bazel-bin/tpu_raiden/core/controller/raiden_orchestrator_main \
#      /workspace/wheels/
# build.sh already builds and symlinks both binaries; the wheel does not
# bundle them, so the registry pod runs them from the wheels NFS mount.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: ttpu-32b-off-v2-xreplica
  namespace: cloud-devkit-jobs
spec:
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - check
  replicatedJobs:
    # registry: global registry + orchestrator, the phase-4 control plane.
    # CPU-only; must outlive both servers, so it never exits on its own and
    # fails loudly if either binary dies.
    - name: registry
      replicas: 1
      template:
        spec:
          ttlSecondsAfterFinished: 900
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              volumes:
                - name: wheels-nfs
                  nfs:
                    server: 10.225.237.178
                    path: /workspace/wheels
              containers:
                - name: registry
                  image: "us-central1-docker.pkg.dev/cloud-tpu-inference-test/vllm-tpu-rdna/torchtpu-vllm:yinlin_google_com_block-major-raiden-t211b-syncfix"
                  imagePullPolicy: Always
                  env:
                    - name: REGISTRY_PORT
                      value: "48500"
                    - name: ORCH_PORT
                      value: "48600"
                  volumeMounts:
                    - name: wheels-nfs
                      mountPath: /root/wheels
                      readOnly: true
                  command: [ "/bin/bash", "-c" ]
                  args:
                    - |
                      set -eo pipefail
                      : "${CDK_OUTPUT_DIR:=/tmp/cdk-outputs}"
                      export CDK_OUTPUT_DIR
                      mkdir -p "$CDK_OUTPUT_DIR"
                      export GLOG_alsologtostderr=1

                      for bin in global_registry_server raiden_orchestrator_main; do
                        [ -x "/root/wheels/$bin" ] || {
                          echo "RESULT: FAIL (/root/wheels/$bin missing — copy it from" \
                               "bazel-bin after the raiden build, see the recipe header)"
                          exit 1
                        }
                      done

                      echo "Starting global_registry_server on :${REGISTRY_PORT}"
                      /root/wheels/global_registry_server --port="${REGISTRY_PORT}" \
                        > "$CDK_OUTPUT_DIR/registry.log" 2>&1 &
                      REGISTRY_PID=$!
                      echo "Starting raiden_orchestrator_main on :${ORCH_PORT}"
                      /root/wheels/raiden_orchestrator_main --port="${ORCH_PORT}" \
                        > "$CDK_OUTPUT_DIR/orchestrator.log" 2>&1 &
                      ORCH_PID=$!

                      # Either process dying is a hard failure: servers would
                      # silently degrade to local-only lookups.
                      while true; do
                        kill -0 "$REGISTRY_PID" 2>/dev/null || {
                          echo "RESULT: FAIL (global_registry_server exited)"
                          tail -50 "$CDK_OUTPUT_DIR/registry.log"; exit 1
                        }
                        kill -0 "$ORCH_PID" 2>/dev/null || {
                          echo "RESULT: FAIL (raiden_orchestrator_main exited)"
                          tail -50 "$CDK_OUTPUT_DIR/orchestrator.log"; exit 1
                        }
                        sleep 5
                      done
                  resources:
                    limits:
                      memory: "8Gi"
                      cpu: "4"
                    requests:
                      memory: "4Gi"
                      cpu: "2"

    # server-a / server-b: identical V2-store replicas (dense Qwen3-32B,
    # single host, TP8) plus the phase-4 config: the
    # registry/orchestrator addresses, store_server_ip = pod IP
    # (bind-and-advertise, so peers can dial this store), and a legible
    # per-replica raiden_job_name (the registry keys stores by RaidenId, so
    # the names must differ).
    - name: server-a
      replicas: 1
      template:
        spec:
          ttlSecondsAfterFinished: 900
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-topology: "2x2x1"
                cloud.google.com/gke-tpu-accelerator: "tpu7x"
              volumes:
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: "64Gi"
                - name: hf-token-volume
                  secret:
                    secretName: vllm-hf-token
                    items:
                      - key: HF_TOKEN
                        path: token
                - name: huggingface-storage
                  ephemeral:
                    volumeClaimTemplate:
                      spec:
                        storageClassName: "premium-rwo"
                        accessModes: [ "ReadWriteOnce" ]
                        resources:
                          requests:
                            storage: 600Gi
                - name: torchtpu-vllm-nfs
                  nfs:
                    server: 10.225.237.178
                    path: /workspace/vllm-torchtpu/raiden_controller
                - name: wheels-nfs
                  nfs:
                    server: 10.225.237.178
                    path: /workspace/wheels
              containers:
                - name: vllm-server
                  image: "us-central1-docker.pkg.dev/cloud-tpu-inference-test/vllm-tpu-rdna/torchtpu-vllm:yinlin_google_com_block-major-raiden-t211b-syncfix"
                  imagePullPolicy: Always
                  env:
                    - name: REPLICA
                      value: "a"
                    # Cross-replica sharing requires an identical hash seed
                    # on BOTH replicas: vLLM seeds its block-hash chain with
                    # NONE_HASH = os.urandom(32) when PYTHONHASHSEED is
                    # unset, so B's lookups could never match A's published
                    # registry entries (proven in j-5ff9d2dc: A published
                    # 2112 entries, B replayed with cached_tokens=0 on all
                    # 8 docs). Any fixed value works; keep both legs equal.
                    - name: PYTHONHASHSEED
                      value: "0"
                    # Key-space diagnostic (j-c92b643e missed 100% even with
                    # the seed pinned): logs the namespaced sub-hash of each
                    # store batch and registry-miss lookup so A's and B's
                    # keys can be diffed from the logs. Remove once the
                    # cross-replica miss is root-caused.
                    - name: VLLM_TPU_OFFLOAD_DEBUG_KEYS
                      value: "1"
                    - name: JS_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
                    - name: MY_POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: MODEL
                      value: "Qwen/Qwen3-32B"
                    - name: PORT
                      value: "8000"
                    - name: GPU_MEM_UTIL
                      value: "0.3"
                    # Must hold pass 1's whole working set: 8 docs x 264
                    # 128-token chunks = 2112 blocks x 32 MiB = 66 GiB. At
                    # 40 GiB (1280 blocks) A's own saves LRU-evict and
                    # unregister docs 0-3 before the replay, so exactly
                    # those replays miss (j-b7ed5cd0: docs 4-7 hit with
                    # full cached_tokens=33792, docs 0-3 got 0). 80 GiB =
                    # 2560 blocks, ~20% slack.
                    - name: KV_OFFLOADING_SIZE
                      value: "80"
                    - name: RAIDEN_CONTROLLER_PORT
                      value: "47800"
                    - name: REGISTRY_PORT
                      value: "48500"
                    - name: ORCH_PORT
                      value: "48600"
                    - name: RAIDEN_WHL
                      value: "/root/wheels/tpu_raiden_torch-0.0.1.dev20260803223638-1_raiden_controller_72fb11f-cp312-cp312-manylinux_2_31_x86_64.whl"
                    - name: TPU_TOPOLOGY
                      value: "2x2x1"
                    - name: TPU_CHIPS_PER_HOST_BOUNDS
                      value: "2,2,1"
                    - name: TPU_HOST_BOUNDS
                      value: "1,1,1"
                    - name: TPU_STDERR_LOG_LEVEL
                      value: "0"
                    - name: VLLM_LOGGING_LEVEL
                      value: "INFO"
                    - name: VLLM_TPU_BLOCK_MAJOR_KV
                      value: "1"
                    # Explicitly disable megascale (single-host)
                    - name: MEGASCALE_NUM_SLICES
                      value: ""
                    - name: MEGASCALE_SLICE_ID
                      value: ""
                    - name: TPU_PROCESS_ADDRESSES
                      value: ""
                    - name: TPU_WORKER_HOSTNAMES
                      value: ""
                    - name: TPU_PROCESS_PORT
                      value: ""
                    - name: MEGASCALE_COORDINATOR_ADDRESS
                      value: ""
                    - name: MEGASCALE_PORT
                      value: ""
                  volumeMounts:
                    - name: hf-token-volume
                      mountPath: /root/.cache/huggingface/token
                      subPath: token
                      readOnly: true
                    - name: huggingface-storage
                      mountPath: /root/.cache/huggingface/
                    - name: dshm
                      mountPath: /dev/shm
                    - name: torchtpu-vllm-nfs
                      mountPath: /root/torchtpu-vllm
                    - name: wheels-nfs
                      mountPath: /root/wheels
                      readOnly: true
                  command: [ "/bin/bash", "-c" ]
                  args:
                    - |
                      set -eo pipefail
                      : "${CDK_OUTPUT_DIR:=/tmp/cdk-outputs}"
                      export CDK_OUTPUT_DIR
                      mkdir -p "$CDK_OUTPUT_DIR"
                      export PYTHONUNBUFFERED=1

                      # ---- Inject the V2 code: branch source + wheel ----
                      echo "===== Syncing dependencies to pyproject.toml ====="
                      mkdir -p /tmp/depsync
                      sed -E '/"torch-tpu==/d' /root/torchtpu-vllm/pyproject.toml > /tmp/depsync/pyproject.toml
                      uv pip install --system -r /tmp/depsync/pyproject.toml --index-url https://pypi.org/simple

                      [ -n "$RAIDEN_WHL" ] && [ -f "$RAIDEN_WHL" ] || { echo "RESULT: FAIL (no tpu_raiden_torch wheel in /root/wheels)"; exit 1; }
                      echo "Installing raiden wheel: $RAIDEN_WHL"
                      uv pip install --system --no-deps "$RAIDEN_WHL"

                      export PYTHONPATH=/root/torchtpu-vllm/src:/root/torchtpu-vllm:${PYTHONPATH:-}

                      # Phase-4 preflight: the wheel must ship the remote-read
                      # surface, and the branch the namespace derivation.
                      python3 -c 'from tpu_raiden.api.torch.kv_cache_store import KVCacheStore as S; assert hasattr(S, "num_registered_workers"), "raiden wheel predates wheel #1"; assert hasattr(S, "read_remote") and hasattr(S, "poll_remote_read_status"), "raiden wheel predates the remote-read surface"; import vllm_torchtpu.offload.raiden_store as rs; assert hasattr(rs, "derive_offload_namespace"), "vllm-torchtpu branch predates phase 4"; import vllm_torchtpu.offload.raiden_connector as rc; assert hasattr(rc, "TPURaidenOffloadingConnector"); print("phase-4 preflight OK:", rc.__file__)' \
                        || { echo "RESULT: FAIL (phase-4 preflight)"; exit 1; }

                      # The registry never retries a failed RegisterStore, and
                      # vLLM is also handed raiden_orchestrator_address, so wait
                      # for BOTH control-plane ports before binding the store.
                      REGISTRY_HOST="${JS_NAME}-registry-0-0.${JS_NAME}"
                      for port in "${REGISTRY_PORT}" "${ORCH_PORT}"; do
                        echo "Waiting for ${REGISTRY_HOST}:${port} (up to 10 min)..."
                        waited=0
                        until (exec 3<>"/dev/tcp/${REGISTRY_HOST}/${port}") 2>/dev/null; do
                          exec 3>&- 2>/dev/null || true
                          [ "$waited" -ge 600 ] && { echo "RESULT: FAIL (${REGISTRY_HOST}:${port} not reachable)"; exit 1; }
                          sleep 2; waited=$((waited + 2))
                        done
                        exec 3>&- 2>/dev/null || true
                        echo "${REGISTRY_HOST}:${port} reachable (${waited}s)"
                      done

                      export LIBTPU_INIT_ARGS="--xla_tpu_use_enhanced_launch_barrier=false ${LIBTPU_INIT_ARGS:-}"
                      export TPU_PREMAPPED_BUFFER_SIZE=$((16 * 1024 * 1024 * 1024))
                      export TPU_PREMAPPED_BUFFER_TRANSFER_THRESHOLD_BYTES=$((16 * 1024 * 1024 * 1024))
                      export MODEL_IMPL_TYPE=vllm
                      export USE_BATCHED_RPA_KERNEL=1
                      export VLLM_MOE_ROUTING_SIMULATION_STRATEGY=uniform_random
                      # Pod env does not survive vllm's spawn(); re-export.
                      export RAIDEN_DISABLE_SINGLETON_WORKER=1

                      KV_BYTES=$((KV_OFFLOADING_SIZE * 1024 * 1024 * 1024))
                      KV_CFG=$(cat <<EOF
                      {"kv_connector":"TPURaidenOffloadingConnector","kv_role":"kv_both","kv_connector_module_path":"vllm_torchtpu.offload.raiden_connector","kv_connector_extra_config":{"cpu_bytes_to_use":${KV_BYTES},"raiden_controller_port":${RAIDEN_CONTROLLER_PORT},"raiden_job_name":"xreplica-${REPLICA}","global_registry_address":"${REGISTRY_HOST}:${REGISTRY_PORT}","raiden_orchestrator_address":"${REGISTRY_HOST}:${ORCH_PORT}","store_server_ip":"${MY_POD_IP}"}}
                      EOF
                      )
                      echo "Starting vLLM server (offload=V2-store phase 4, replica=${REPLICA}, pod IP=${MY_POD_IP}, registry=${REGISTRY_HOST}:${REGISTRY_PORT})..."

                      # --enable-prompt-tokens-details: off by default in vLLM
                      # 0.26.0, and without it usage.prompt_tokens_details is
                      # never populated -- the check pod's cached-token gate
                      # would fail every replay.
                      exec vllm serve "$MODEL" \
                          --tensor-parallel-size=8 \
                          --gpu-memory-utilization="$GPU_MEM_UTIL" \
                          --kv-transfer-config "$KV_CFG" \
                          --async-scheduling \
                          --enable-prompt-tokens-details \
                          --port="$PORT" \
                          2>&1 | tee "$CDK_OUTPUT_DIR/server.log"
                  resources:
                    limits:
                      google.com/tpu: 4
                      memory: "900Gi"
                      cpu: "16"
                    requests:
                      google.com/tpu: 4
                      memory: "900Gi"
                      cpu: "16"

    - name: server-b
      replicas: 1
      template:
        spec:
          ttlSecondsAfterFinished: 900
          backoffLimit: 0
          template:
            spec:
