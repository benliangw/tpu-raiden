# OffloadingControllerV2 (raiden KVCacheStore) RESET + RESTART-RECOVERY gate.
#
# One self-driving pod covering the two control-plane paths the gpc-xstack
# recipe does not: external cache reset and warm-cache recovery across an
# engine crash. Two server runs:
#
#   run 1:
#     pass A -> N deterministic docs, greedy decode, outputs recorded;
#               blocks stored into the shm-backed raiden store.
#     churn  -> filler docs overflow the deliberately small HBM pool
#               (NUM_GPU_BLOCKS_OVERRIDE), evicting pass-A blocks from HBM.
#     pass B -> replay: external prefix-hit delta > 0 — the docs came back
#               through the store, not the GPU cache.
#     reset  -> POST /reset_prefix_cache?reset_external=true while idle (a
#               dev-mode route: VLLM_SERVER_DEV_MODE=1). The connector
#               flushes its jobs, the manager drains, and store.clear()
#               empties the directory, returns every host block, and wipes
#               the recovery metadata.
#     pass C -> replay: external hit delta == 0 — a wiped store must
#               recompute. This pass also re-stores the docs.
#     churn2 + pass D -> replay: delta > 0 again — the store keeps working
#               after a reset.
#   crash  -> SIGKILL of the whole server process group: no destructors, no
#             cleanup. /dev/shm is pod-level tmpfs (RAIDEN_SHM_KEY), so the
#             KV bytes and the metadata table survive the process death.
#   run 2:
#     pass E -> a fresh vllm serve re-attaches: the store recovers its
#               directory inside plain construction, gated by the
#               config-derived RAIDEN_SHM_MODEL_UID. The SAME docs are
#               replayed; external prefix hits > 0 is the gate — HBM starts
#               empty after the restart, so hits can only come from the
#               recovered (and previously reset-then-refilled) store.
#
# Each replay pass also checks that at most half its outputs diverge from
# pass A within the first few characters — the corrupt-served-KV signature.
# Full byte equality is reported but NOT gated: the TPU serving stack is
# not run-to-run deterministic, and benign divergence flips a token
# mid-rollout while keeping a long common prefix.
#
# REQUIRES a raiden wheel with public clear() (the preflight fails loudly
# otherwise). Both runs must construct an identical engine config or run
# 2's RAIDEN_SHM_MODEL_UID will not match the recovered segments.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: ttpu-qwen35-v2-reset-recovery
  namespace: cloud-devkit-jobs
spec:
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - reset-recovery
  ttlSecondsAfterFinished: 900
  replicatedJobs:
    - name: reset-recovery
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x1
                cloud.google.com/gke-tpu-accelerator: tpu7x
              initContainers:
                - name: tpu-node-setup
                  image: busybox
                  securityContext:
                    privileged: true
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      sysctl -w vm.max_map_count=8388608
                      if [ -f /sys/module/vfio_iommu_type1/parameters/dma_entry_limit ]; then
                        echo 2000000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit
                        echo "Successfully increased dma_entry_limit"
                      fi
              containers:
              - name: vllm-server
                image: us-central1-docker.pkg.dev/cloud-tpu-inference-test/vllm-tpu-rdna/vllm-torchtpu-benliangw_google_com:latest
                imagePullPolicy: Always
                command: ["/bin/bash", "-c"]
                args:
                - |
                  set -eo pipefail
                  : "${CDK_OUTPUT_DIR:=/tmp/cdk-outputs}"
                  export CDK_OUTPUT_DIR
                  mkdir -p "$CDK_OUTPUT_DIR"
                  export PYTHONUNBUFFERED=1

                  echo "===== Syncing dependencies to pyproject.toml ====="
                  mkdir -p /tmp/depsync
                  # vllm installs from the pyproject pin; only the torch-tpu
                  # pin is stripped (the image's baked build is used, below).
                  sed -E '/"torch-tpu==/d' /root/torchtpu-vllm/pyproject.toml > /tmp/depsync/pyproject.toml
                  uv pip install --system -r /tmp/depsync/pyproject.toml --index-url https://pypi.org/simple

                  # torch-tpu stays at the image's baked build: the raiden
                  # wheel resolves torch_tpu symbols from libpywrap at import
                  # and must match its absl ABI; the pyproject-pinned build
                  # does not.
                  echo "Using image torch-tpu (pyproject pin stripped; ABI-matched to the raiden wheel)"

                  RAIDEN_WHL=/root/wheels/tpu_raiden_torch-0.0.1.dev20260804004324-1_raiden_controller_57d0834-cp312-cp312-manylinux_2_31_x86_64.whl
                  [ -f "$RAIDEN_WHL" ] || { echo "RESULT: FAIL (raiden wheel not in /root/wheels)"; exit 1; }
                  echo "Installing raiden wheel: $RAIDEN_WHL"
                  uv pip install --system --no-deps "$RAIDEN_WHL"

                  export PYTHONPATH=/root/torchtpu-vllm/src:/root/torchtpu-vllm:${PYTHONPATH:-}

                  python3 -c 'from tpu_raiden.api.torch import torch_tpu_common_loader as tl; tl.load_torch_tpu_common(); from tpu_raiden.frameworks.torch import _tpu_raiden_torch as trt; S = trt.KVCacheStore; assert hasattr(S, "num_registered_workers"), "raiden wheel too old (missing num_registered_workers)"; assert hasattr(S, "clear") and hasattr(S, "insert_and_lock_detailed"), "raiden wheel lacks clear/insert_and_lock_detailed — the reset passes need them"; import vllm_torchtpu.offload.raiden_connector as rc; assert hasattr(rc, "TPURaidenOffloadingConnector"); print("V2 preflight OK")'                     || { echo "RESULT: FAIL (V2 preflight)"; exit 1; }

                  echo "===== Pre-downloading $MODEL snapshot ====="
                  DL_OK=""
                  for i in $(seq 1 30); do
                    if python3 -c "import os; from huggingface_hub import snapshot_download; snapshot_download(os.environ['MODEL'])"; then
                      DL_OK=1; break
                    fi
                    echo "snapshot_download failed (attempt $i/30); retrying in 60s"
                    sleep 60
                  done
                  [ -n "$DL_OK" ] || { echo "RESULT: FAIL (model snapshot download)"; exit 1; }
                  export HF_HUB_OFFLINE=1

                  # Pod env does not survive vllm's spawn(); re-export. The
                  # fixed RAIDEN_SHM_KEY makes the KV segments and metadata
                  # table re-attachable by run 2; RAIDEN_SHM_MODEL_UID is
                  # derived by the V2 spec from the model/geometry config and
                  # must NOT be set here.
                  export RAIDEN_DISABLE_SINGLETON_WORKER=1
                  export RAIDEN_SHM_KEY

                  KV_BYTES=$((KV_OFFLOADING_SIZE * 1024 * 1024 * 1024))
                  KV_CFG=$(cat <<EOF
                  {"kv_connector":"TPURaidenOffloadingConnector","kv_role":"kv_both","kv_connector_module_path":"vllm_torchtpu.offload.raiden_connector","kv_connector_extra_config":{"cpu_bytes_to_use":${KV_BYTES},"raiden_controller_port":${RAIDEN_CONTROLLER_PORT}}}
                  EOF
                  )

                  # Small HBM pool + small max-num-seqs: the churn passes must
                  # overflow HBM so replays are served by the store, and the
                  # serial driver never needs more than a few sequences. Both
                  # runs use the identical config so run 2's shm model UID
                  # matches run 1's segments.
                  start_server() {
                    # New session so the whole server tree (API server +
                    # engine-core workers) dies with one kill -9 on the pgid.
                    setsid bash -c "exec vllm serve '$MODEL' \
                        --tensor_parallel_size=4 \
                        --enable-expert-parallel \
                        --max-model-len=8192 \
                        --max-num-batched-tokens=4096 \
                        --max-num-seqs=4 \
                        --num-gpu-blocks-override=$NUM_GPU_BLOCKS_OVERRIDE \
                        --enable-prefix-caching \
                        --mamba-cache-mode=align \
                        --no-async-scheduling \
                        --language-model-only \
                        --gpu-memory-utilization=$GPU_MEM_UTIL \
                        --kv-transfer-config '$KV_CFG' \
                        --port=$PORT" \
                        > "$CDK_OUTPUT_DIR/server_run$1.log" 2>&1 &
                    SERVER_PID=$!
                    echo "run $1: server pgid $SERVER_PID"
                  }

                  wait_health() {
                    local timeout=$((120 * 60)) waited=0
                    until curl -sf "http://127.0.0.1:${PORT}/health" >/dev/null 2>&1; do
                      if ! kill -0 "$SERVER_PID" 2>/dev/null; then
                        echo "RESULT: FAIL (server run $1 exited during startup; see server_run$1.log)"
                        tail -50 "$CDK_OUTPUT_DIR/server_run$1.log" || true
                        exit 1
                      fi
                      if [ "$waited" -ge "$timeout" ]; then
                        echo "RESULT: FAIL (server run $1 not healthy in 120 min)"; exit 1
                      fi
                      sleep 5; waited=$((waited + 5))
                    done
                    echo "run $1: healthy after ${waited}s"
                  }

                  cat > /tmp/driver.py <<'PYEOF'
                  import json, os, sys, time, urllib.error, urllib.request

                  PORT = os.environ["PORT"]
                  MODEL = os.environ["MODEL"]
                  N = int(os.environ.get("NUM_PROMPTS", "8"))
                  CHURN = int(os.environ.get("NUM_CHURN", "16"))
                  WORDS = int(os.environ.get("PROMPT_WORDS", "1200"))
                  OUT = int(os.environ.get("OUTPUT_LEN", "64"))
                  BASE = f"http://127.0.0.1:{PORT}"
                  PHASE = sys.argv[1]  # "gate" (run 1) | "replay" (run 2)
                  RECORD = os.path.join(os.environ["CDK_OUTPUT_DIR"], "pass1.json")

                  def prompt(tag, i):
                      # The tag lives ONLY in the head: it changes the first
                      # tokens, so every chained block hash differs between
                      # doc/churn prompts — no accidental prefix sharing.
                      # The body is tag-free and folds i mod 10: these
                      # w{d}x{j} words are ~6.1 Qwen3.5 tokens each, and
                      # fatter words overflow --max-model-len=8192.
                      # Identical bodies are fine; the head keeps hashes
                      # apart.
                      head = f"[{tag}-{i:04d}] "
                      body = " ".join(f"w{i % 10}x{j}" for j in range(WORDS))
                      return head + body + "\nSummarize the above in one line:"

                  def complete(text):
                      req = urllib.request.Request(
                          f"{BASE}/v1/completions",
                          data=json.dumps({
                              "model": MODEL, "prompt": text,
                              "max_tokens": OUT, "temperature": 0.0,
                              "seed": 42, "ignore_eos": True,
                          }).encode(),
                          headers={"Content-Type": "application/json"})
                      try:
                          with urllib.request.urlopen(req, timeout=1800) as r:
                              return json.loads(r.read())["choices"][0]["text"]
                      except urllib.error.HTTPError as e:
                          print(f"HTTP {e.code} from the server: "
                                f"{e.read().decode(errors='replace')[:500]}")
                          raise

                  def ext_hits():
                      with urllib.request.urlopen(f"{BASE}/metrics",
                                                  timeout=60) as r:
                          text = r.read().decode()
                      total = 0.0
                      for line in text.splitlines():
                          if line.startswith(
                                  "vllm:external_prefix_cache_hits_total"):
                              total += float(line.rsplit(" ", 1)[1])
                      return total

                  def replay(tag, docs):
                      before = ext_hits()
                      outs = [complete(p) for p in docs]
                      return outs, ext_hits() - before

                  # Byte equality is informational only (the stack is not
                  # run-to-run deterministic); the gated signal is
                  # immediate divergence — corrupt served KV
                  # garbles the continuation from the first tokens, while a
                  # benign token flip mid-rollout keeps a long common prefix.
                  EARLY_DIV_CHARS = 8

                  failures = []

                  def check_outputs(tag, ref, outs):
                      exact, early_div = 0, []
                      for i, (a, b) in enumerate(zip(ref, outs)):
                          n = min(len(a), len(b))
                          lcp = 0
                          while lcp < n and a[lcp] == b[lcp]:
                              lcp += 1
                          if a == b:
                              exact += 1
                          elif lcp < EARLY_DIV_CHARS:
                              early_div.append(i)
                      print(f"pass {tag}: {exact}/{len(ref)} byte-identical, "
                            f"early_divergences={early_div}")
                      if len(early_div) > len(ref) // 2:
                          failures.append(
                              f"pass {tag}: {len(early_div)}/{len(ref)} "
                              "outputs diverge from pass A within the first "
                              f"{EARLY_DIV_CHARS} chars — served KV looks "
                              "corrupt, not benignly nondeterministic")

                  docs = [prompt("doc", i) for i in range(N)]

                  if PHASE == "replay":
                      # Run 2: HBM starts empty after the restart, so any
                      # external prefix hit can only come from the store the
                      # fresh server recovered out of shared memory.
                      with open(RECORD) as f:
                          first = json.load(f)
                      outs_e, delta_e = replay("E", docs)
                      print(f"pass E (post-restart): ext_hit_delta={delta_e}")
                      check_outputs("E", first, outs_e)
                      if delta_e <= 0:
                          failures.append(
                              "pass E saw no external prefix hits after the "
                              "restart — the store did not recover; the "
                              "replay was recomputed")
                      if failures:
                          print("RESULT: FAIL (" + "; ".join(failures) + ")")
                          sys.exit(1)
                      print(f"RESULT: PASS (reset gate B/C/D deltas OK in run "
                            f"1; recovery pass E delta={delta_e:.0f} after "
                            "SIGKILL restart; no early divergences beyond "
                            "threshold)")
                      sys.exit(0)

                  # PHASE == "gate": run 1, the reset gate (passes A-D).
                  print(f"=== pass A: warm {N} docs ===")
                  first = [complete(p) for p in docs]
                  with open(RECORD, "w") as f:
                      json.dump(first, f)
                  time.sleep(10)  # let stores reach terminal

                  print(f"=== churn: {CHURN} fillers to evict HBM ===")
                  for i in range(CHURN):
                      complete(prompt("churnA", i))

                  print("=== pass B: replay (must be served by the store) ===")
                  outs_b, delta_b = replay("B", docs)
                  print(f"pass B: ext_hit_delta={delta_b}")
                  check_outputs("B", first, outs_b)
                  if delta_b <= 0:
                      failures.append(
                          "pass B saw no external prefix hits — the store "
                          "never served; raise NUM_CHURN or lower "
                          "NUM_GPU_BLOCKS_OVERRIDE")

                  print("=== reset_prefix_cache (store.clear) ===")
                  time.sleep(5)  # idle: in-flight jobs drain
                  # Dev-mode route (VLLM_SERVER_DEV_MODE=1 in the pod env —
                  # it 404s otherwise). reset_external=true is what cascades
                  # into the connector's reset_cache (drain -> store.clear);
                  # without it only the local HBM prefix cache resets. Two
                  # transient outcomes while the server drains: the route
                  # returns success=false while blocks are still held, and
                  # the raiden manager raises (a 5xx) when clear() rejects
                  # in-flight transfers or pins — retry both.
                  for attempt in range(6):
                      req = urllib.request.Request(
                          f"{BASE}/reset_prefix_cache?reset_external=true",
                          method="POST", data=b"")
                      try:
                          with urllib.request.urlopen(req, timeout=300) as r:
                              ok = json.loads(r.read()).get("success")
                      except urllib.error.HTTPError as e:
                          if e.code == 404:
                              print("RESULT: FAIL (/reset_prefix_cache is 404 "
                                    "— VLLM_SERVER_DEV_MODE not in effect)")
                              sys.exit(1)
                          print(f"reset attempt {attempt}: HTTP {e.code}: "
                                f"{e.read().decode(errors='replace')[:500]}")
                          ok = False
                      else:
                          print(f"reset attempt {attempt}: success={ok}")
                      if ok:
                          break
                      time.sleep(10)
                  else:
                      print("RESULT: FAIL (reset_prefix_cache never reported "
                            "success — blocks still held after 6 attempts)")
                      sys.exit(1)

                  print("=== pass C: replay after reset (must recompute) ===")
                  outs_c, delta_c = replay("C", docs)
                  print(f"pass C: ext_hit_delta={delta_c}")
                  check_outputs("C", first, outs_c)
                  if delta_c != 0:
                      failures.append(
                          f"pass C got {delta_c} external hits from a wiped "
                          "store — clear() left entries behind")
                  time.sleep(10)  # pass C's re-stores reach terminal

                  print(f"=== churn2 + pass D: store works after reset ===")
                  for i in range(CHURN):
                      complete(prompt("churnB", i))
                  outs_d, delta_d = replay("D", docs)
                  print(f"pass D: ext_hit_delta={delta_d}")
                  check_outputs("D", first, outs_d)
                  if delta_d <= 0:
                      failures.append(
                          "pass D saw no external hits — the store stopped "
                          "admitting after the reset")

                  if failures:
                      print("RESULT: FAIL (" + "; ".join(failures) + ")")
                      sys.exit(1)
                  print(f"gate (run 1) OK: B/C/D deltas {delta_b}/{delta_c}/"
                        f"{delta_d}; proceeding to crash + recovery")
                  PYEOF

                  echo "===== run 1: reset gate (passes A-D), then crash ====="
                  start_server 1
                  wait_health 1
                  python3 /tmp/driver.py gate 2>&1 | tee "$CDK_OUTPUT_DIR/gate.log"
                  status=${PIPESTATUS[0]}
                  if [ "$status" -ne 0 ]; then
                    kill -9 -- "-$SERVER_PID" 2>/dev/null || true
                    exit "$status"
                  fi
                  # Let in-flight saves reach terminal before the crash: the
                  # gate is recovery of COMMITTED entries, not crash timing.
                  sleep 30

                  echo "===== SIGKILL server process group (no destructors) ====="
                  kill -9 -- "-$SERVER_PID" 2>/dev/null || true
                  # Belt and suspenders for any re-parented engine procs.
                  pkill -9 -f "vllm serve" 2>/dev/null || true
                  pkill -9 -f EngineCore 2>/dev/null || true
                  sleep 10
                  ls -la /dev/shm | tee "$CDK_OUTPUT_DIR/shm_after_crash.txt"

                  echo "===== run 2: restart and replay (pass E) ====="
                  start_server 2
                  wait_health 2
                  python3 /tmp/driver.py replay 2>&1 | tee "$CDK_OUTPUT_DIR/replay.log"
                  status=${PIPESTATUS[0]}

                  kill -9 -- "-$SERVER_PID" 2>/dev/null || true
                  exit "$status"
                env:
                  - name: MODEL
                    value: "Qwen/Qwen3.5-35B-A3B-FP8"
                  - name: PORT
                    value: "8000"
                  - name: GPU_MEM_UTIL
                    value: "0.60"
                  # Modest pool: the shm-backed host segments are charged
                  # against the pod's memory, so leave headroom under the
                  # dshm sizeLimit below.
                  - name: KV_OFFLOADING_SIZE
                    value: "100"
                  - name: RAIDEN_CONTROLLER_PORT
                    value: "47800"
                  - name: RAIDEN_SHM_KEY
                    value: "qwen35-v2-reset-recovery"
                  # Required for restart recovery: vLLM seeds its block-hash
                  # chain with NONE_HASH = os.urandom(32) when PYTHONHASHSEED
                  # is unset, so run 2's hashes could never match the
                  # recovered directory (every replay lookup MISSes). Any
                  # fixed value works; it must be identical across runs.
                  - name: PYTHONHASHSEED
                    value: "0"
                  # Deliberately tiny HBM pool (64 x 1280-token blocks): the
                  # 16-doc churn (~5 blocks each) overflows it, so replays
                  # must come back through the store. Sized for the serial
                  # driver (max-num-seqs 4 x 7 blocks << 64). Also small
                  # enough that run 2's post-restart HBM is trivially empty
                  # of doc blocks before pass E.
                  - name: NUM_GPU_BLOCKS_OVERRIDE
                    value: "64"
                  - name: NUM_PROMPTS
                    value: "8"
                  - name: NUM_CHURN
                    value: "16"
                  # Synthetic w{i}x{j} words measure ~6.1 tokens each on the
                  # Qwen3.5 tokenizer: 1200 words ≈ 7.3k prompt tokens, inside
                  # --max-model-len=8192 with OUTPUT_LEN but with little slack
                  # — re-measure before raising this or fattening the words.
                  - name: PROMPT_WORDS
                    value: "1200"
                  - name: OUTPUT_LEN
                    value: "64"
                  - name: TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL
                    value: "1"
                  - name: RAGGED_GATED_DELTA_RULE_IMPL
                    value: "chunked_jax_pd"
                  - name: TPU_KV_CACHE_HEADROOM_MIB
                    value: "10240"
                  - name: TPU_TOPOLOGY
                    value: "2x2x1"
                  - name: TPU_CHIPS_PER_HOST_BOUNDS
                    value: "2,2,1"
                  - name: TPU_HOST_BOUNDS
                    value: "1,1,1"
                  - name: TPU_LIBRARY_PATH
                    value: ""
                  - name: VLLM_LOGGING_LEVEL
                    value: "INFO"
                  # /reset_prefix_cache is a dev-mode-only route in vLLM
                  # 0.26.0 (registered under envs.VLLM_SERVER_DEV_MODE);
                  # without this the reset POST 404s.
                  - name: VLLM_SERVER_DEV_MODE
                    value: "1"
                  - name: MEGASCALE_NUM_SLICES
                    value: ""
                  - name: MEGASCALE_SLICE_ID
                    value: ""
                  - name: TPU_PROCESS_ADDRESSES
                    value: ""
                  - name: TPU_WORKER_HOSTNAMES
                    value: ""
                  - name: TPU_PROCESS_PORT
                    value: ""
                  - name: MEGASCALE_COORDINATOR_ADDRESS
                    value: ""
                  - name: MEGASCALE_PORT
                    value: ""
                  - name: HF_HUB_DISABLE_XET
                    value: "1"
                  - name: LIBTPU_INIT_ARGS
                    value: "--xla_tpu_use_enhanced_launch_barrier=false"
                  - name: RAIDEN_DISABLE_SINGLETON_WORKER
                    value: "1"
                  - name: TPU_PREMAPPED_BUFFER_SIZE
                    value: "8589934592"
                volumeMounts:
                  - name: hf-token-volume
                    mountPath: /root/.cache/huggingface/token
                    subPath: token
                    readOnly: true
                  - name: huggingface-storage
                    mountPath: /root/.cache/huggingface/
                  - name: dshm
                    mountPath: /dev/shm
                  - name: torchtpu-vllm-nfs
                    mountPath: /root/torchtpu-vllm
                  - name: wheels-nfs
                    mountPath: /root/wheels
                    readOnly: true
                securityContext:
                  privileged: true
                  capabilities:
                    add:
                    - IPC_LOCK
                resources:
                  limits:
                    google.com/tpu: 4
                    memory: "900Gi"
                    cpu: "16"
                  requests:
                    google.com/tpu: 4
                    memory: "900Gi"
                    cpu: "16"
                ports:
                  - containerPort: 8000

              volumes:
              - name: dshm
                emptyDir:
                  medium: Memory
                  # KV_OFFLOADING_SIZE plus the metadata table and headroom;
                  # tmpfs usage is charged against the pod's 900Gi.
                  sizeLimit: "200Gi"
              - name: hf-token-volume
                secret:
                  secretName: vllm-hf-token
                  items:
                  - key: HF_TOKEN
                    path: token
              - name: huggingface-storage
                ephemeral:
                  volumeClaimTemplate:
                    spec:
                      storageClassName: "premium-rwo"
                      accessModes: [ "ReadWriteOnce" ]
                      resources:
                        requests:
                          storage: 256Gi
              - name: torchtpu-vllm-nfs
                nfs:
                  server: 10.225.237.178
                  # Pins the job to benliangw/raiden_controller.
                  path: /workspace/vllm-torchtpu/raiden_controller
              - name: wheels-nfs
                nfs:
                  server: 10.225.237.178
                  path: /workspace/wheels
