    # ---------------------------------------------------------
    # SMOKE / KNOWN-ANSWER / PERFORMANCE BENCHMARK (via the disagg proxy)
    # ---------------------------------------------------------
    - name: benchmark
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          ttlSecondsAfterFinished: 900
          template:
            spec:
              restartPolicy: Never
              volumes:
                - name: hf-token-volume
                  secret:
                    secretName: vllm-hf-token
                    items:
                      - key: HF_TOKEN
                        path: token
              containers:
              - name: vllm-test
                image: vllm/vllm-tpu:nightly
                imagePullPolicy: Always
                volumeMounts:
                  - name: hf-token-volume
                    mountPath: /root/.cache/huggingface/token
                    subPath: token
                    readOnly: true
                command: ["/bin/bash", "-c"]
                args:
                  - |
                    set -eo pipefail
                    : "${CDK_OUTPUT_DIR:=/tmp/cdk-outputs}"
                    export CDK_OUTPUT_DIR
                    mkdir -p "$CDK_OUTPUT_DIR"
                    export PYTHONUNBUFFERED=1

                    # lm_eval pinned (and installed up front, overlapping
                    # server startup) so both A/B legs — and any later rerun —
                    # score gsm8k with the identical harness.
                    pip install --quiet "lm_eval[api]==0.4.12"

                    PREFILLER_DNS="${JS_NAME}-prefill-0-0.${JS_NAME}"
                    DECODER_DNS="${JS_NAME}-decode-0-0.${JS_NAME}"
                    PROXY="http://${PREFILLER_DNS}:10000"

                    wait_for() {
                      local name="$1" url="$2" timeout="$3" elapsed=0 interval=5
                      echo "Waiting for $name up ($url, up to ${timeout}s)"
                      until curl -sf "$url" > /dev/null; do
                        if [ "$elapsed" -ge "$timeout" ]; then
                          echo "RESULT: FAIL ($name did not become healthy within ${timeout}s)" >&2
                          exit 1
                        fi
                        sleep "$interval"; elapsed=$((elapsed + interval))
                      done
                      echo "$name is up (${elapsed}s)"
                    }

                    # Servers download deps + model and compile; allow long startup.
                    wait_for prefill "http://$PREFILLER_DNS:8000/health" $((90 * 60))
                    wait_for decode  "http://$DECODER_DNS:7200/health"  $((90 * 60))
                    wait_for proxy   "$PROXY/healthcheck"               $((10 * 60))

                    echo "Waiting for engine readiness (first compile, up to 60 min)..."
                    max_wait=$((60 * 60)); waited=0
                    until curl -sf --max-time 300 -X POST "$PROXY/v1/completions" \
                        -H "Content-Type: application/json" \
                        -d "{\"model\": \"$MODEL\", \"prompt\": \"Hello\", \"max_tokens\": 5}" > /dev/null; do
                      if ! curl -sf "http://$PREFILLER_DNS:8000/health" > /dev/null 2>&1; then
                        echo "RESULT: FAIL (prefill /health went down while waiting for engine readiness)"; exit 1
                      fi
                      if ! curl -sf "http://$DECODER_DNS:7200/health" > /dev/null 2>&1; then
                        echo "RESULT: FAIL (decode /health went down while waiting for engine readiness)"; exit 1
                      fi
                      if [ "$waited" -ge "$max_wait" ]; then
                        echo "RESULT: FAIL (engine not ready within 60 minutes)"; exit 1
                      fi
                      echo "Engine compiling, waiting 30s..."; sleep 30; waited=$((waited + 30))
                    done
                    echo "Engines are ready."

                    echo "===== Smoke test: prefill->Raiden KV transfer->decode ====="
                    # One informational natural-language request. Raw
                    # (un-templated) prompts can legitimately make the instruct
                    # model emit only special tokens (empty text), so this can't
                    # distinguish a healthy pipeline from a corrupted KV
                    # transfer — the known-answer probes below are the real
                    # gate. return_token_ids exposes what was generated.
                    fail=0
                    i=0
                    for prompt in \
                      "Good morning. What are the capitals of the US, China and Armenia?"; do
                      i=$((i + 1))
                      echo "--- request $i: $prompt"
                      if ! curl -fsS --max-time 600 -X POST "$PROXY/v1/completions" \
                          -H "Content-Type: application/json" \
                          -d "{\"model\": \"$MODEL\", \"prompt\": \"$prompt\", \"max_tokens\": 64, \"temperature\": 0, \"return_token_ids\": true}" \
                          | tee -a "$CDK_OUTPUT_DIR/smoke.log"; then
                        echo ""; echo "request $i FAILED"; fail=1
                      fi
                      echo ""
                    done

                    echo "--- known-answer probes: three-way equivalence (cold/warm/proxy)"
                    python3 - "$PROXY" "http://$PREFILLER_DNS:8000" "http://$DECODER_DNS:7200" \
                        "$MODEL" "$CDK_OUTPUT_DIR" <<'KA_EOF' || fail=1
                    import json, sys, urllib.request
                    proxy, prefill, decode, model, outdir = sys.argv[1:]
                    _ABSENT = object()
                    def probe(name, base_url, prompt_len, max_tokens,
                              token, expect=_ABSENT):
                        payload = {
                            "model": model,
                            "prompt": [token] * prompt_len,
                            "max_tokens": max_tokens,
                            "temperature": 0.0,
                            "seed": 0,
                            "ignore_eos": True,
                            "add_special_tokens": False,
                            "return_token_ids": True,
                        }
                        req = urllib.request.Request(
                            base_url + "/v1/completions",
                            data=json.dumps(payload).encode(),
                            headers={"Content-Type": "application/json"})
                        try:
                            with urllib.request.urlopen(req, timeout=600) as r:
                                body = json.load(r)
                        except Exception as exc:
                            print(f"{name}: REQUEST ERROR: {exc}")
                            return None
                        with open(f"{outdir}/smoke_ka_{name}.json", "w") as f:
                            json.dump(body, f, indent=2)
                        ids = body["choices"][0].get("token_ids")
                        text = body["choices"][0].get("text", "")
                        if expect is _ABSENT:
                            ok = ids == [token] * max_tokens
                            print(f"{name}: {'PASS' if ok else 'FAIL'} "
                                  f"token={token} token_ids={ids} text={text!r}")
                            return ids
                        # expect=None -> caller compares; just report and return
                        print(f"{name}: token={token} token_ids={ids} "
                              f"text={text!r}")
                        return ids

                    # ---------------------------------------------------------
                    # CORRECTNESS PROBES
                    #
                    # Run each prompt cold on prefill, warm on prefill, and
                    # through the proxy. Warm must equal cold (prefix-cache
                    # transparency), and proxy must equal cold (Stage-3
                    # transfer equivalence). The lengths cover below and at
                    # the 32768-token PCP scheduler-block boundary.
                    def three_way(name, length, token):
                        cold = probe(f"{name}-cold", prefill, length, 8, token,
                                     expect=None)
                        warm = probe(f"{name}-warm", prefill, length, 8, token,
                                     expect=None)
                        prox = probe(f"{name}-proxy", proxy, length, 8, token,
                                     expect=None)
                        if not cold or not warm or not prox:
                            print(f"{name}: FAIL (no output: cold={cold} "
                                  f"warm={warm} proxy={prox})")
                            return {"apc": False, "transfer": False}
                        apc_ok = warm == cold
                        xfer_ok = prox == cold
                        print(f"{name}: apc={'PASS' if apc_ok else 'FAIL'} "
                              f"transfer={'PASS' if xfer_ok else 'FAIL'} "
                              f"len={length} cold={cold} warm={warm} "
                              f"proxy={prox}")
                        return {"apc": apc_ok, "transfer": xfer_ok}

                    # Both lengths sit at or below one prefill scheduler
                    # block (block_size * pcp = 32768).
                    results = {}
                    for _name, _len, _tok in (("len8192", 8192, 88),
                                              ("len32768", 32768, 89)):
                        r = three_way(_name, _len, _tok)
                        results[f"{_name}-apc-transparency"] = r["apc"]
                        results[f"{_name}-transfer-equivalence"] = r["transfer"]

                    print("known-answer summary:", json.dumps(results))
                    sys.exit(0 if all(results.values()) else 1)
                    KA_EOF

                    # Correctness failure is NOT fatal here: run the
                    # performance phase too so one job yields both signals, and
                    # fail at the very end.
                    if [ "$fail" -ne 0 ]; then
                      echo "CORRECTNESS: FAIL (continuing to the performance phase)"
                    else
                      echo "CORRECTNESS: PASS"
                    fi

                    # ---------------------------------------------------------
                    # OFFLOAD-TIER LONG-PREFIX BENCHMARK
                    #
                    # Revisit NDOCS distinct 32768-token prefixes whose working
                    # set exceeds the 16-block HBM pool. A unique 128-token tail
                    # prevents exact-request hits. Revisit passes should restore
                    # the prefix from CPU (external-prefix hit rate rises and
                    # prefill time falls), while the baseline recomputes it.
                    # Requests remain sequential because this pool cannot hold
                    # two of these requests concurrently.
                    cat << 'EOF' | sed 's/^[[:space:]]\{20\}//' > /tmp/bench_offload_tier.py
                    import json
                    import os
                    import re
                    import time
                    import urllib.request

                    PORT = os.environ.get("PROXY_PORT", "10000")
                    JS = os.environ["JS_NAME"]
                    PROXY = f"http://{JS}-prefill-0-0.{JS}:{PORT}"
                    PREFILL = f"http://{JS}-prefill-0-0.{JS}:8000"
                    OUT = os.environ["CDK_OUTPUT_DIR"]
                    MODEL = os.environ["MODEL"]
                    NDOCS = int(os.environ.get("OFFLOAD_DOCS", "4"))
                    PREFIX = 32768  # one prefill offloadable block (4096*pcp8)
                    TAIL = 128

                    KEYS = dict(ttft_s="time_to_first_token_seconds_sum",
                                ttft_n="time_to_first_token_seconds_count",
                                pre_s="request_prefill_time_seconds_sum",
                                pre_n="request_prefill_time_seconds_count",
                                hit="external_prefix_cache_hits_total",
                                q="external_prefix_cache_queries_total")

                    def scrape():
                        with urllib.request.urlopen(f"{PREFILL}/metrics",
                                                    timeout=30) as r:
                            text = r.read().decode()
                        m = {}
                        for line in text.splitlines():
                            if line.startswith("#"):
                                continue
                            mo = re.match(
                                r"vllm:([a-z_0-9]+)\{.*\} ([0-9.e+-]+)$", line)
                            if mo:
                                m[mo.group(1)] = (m.get(mo.group(1), 0.0)
                                                  + float(mo.group(2)))
                        return m

                    # Filler ids 120+ (docs) and 200+ (tails) are disjoint
                    # from the smoke/probe tokens (84-90) so no phase warms
                    # another.
                    def ask(doc, visit):
                        prompt = ([120 + doc] * PREFIX
                                  + [200 + 10 * visit + doc] * TAIL)
                        payload = {
                            "model": MODEL,
                            "prompt": prompt,
                            "max_tokens": 8,
                            "temperature": 0.0,
                            "seed": 0,
                            "ignore_eos": True,
                            "add_special_tokens": False,
                            "return_token_ids": True,
                        }
                        req = urllib.request.Request(
                            PROXY + "/v1/completions",
                            data=json.dumps(payload).encode(),
                            headers={"Content-Type": "application/json"})
                        t0 = time.time()
                        with urllib.request.urlopen(req, timeout=900) as r:
                            body = json.load(r)
                        ids = body["choices"][0].get("token_ids")
                        return time.time() - t0, ids

                    errors = 0
                    results = []
                    requests_log = []
                    for visit, tag in enumerate(("seed", "revisit1",
                                                 "revisit2")):
                        before = scrape()
                        for doc in range(NDOCS):
                            try:
                                dt, ids = ask(doc, visit)
                                requests_log.append({"visit": tag, "doc": doc,
                                                     "e2e_s": dt,
                                                     "token_ids": ids})
                                print(f"[offload-tier:{tag}] doc{doc} "
                                      f"e2e={dt:.2f}s token_ids={ids}",
                                      flush=True)
                            except Exception as exc:
                                errors += 1
                                print(f"[offload-tier:{tag}] doc{doc} "
                                      f"ERROR: {exc}", flush=True)
                        after = scrape()
                        d = {k: after.get(v, 0) - before.get(v, 0)
                             for k, v in KEYS.items()}
                        n = d["ttft_n"] or 1
                        npre = d["pre_n"] or 1
                        q = d["q"] or 1
                        print(f"[offload-tier:{tag}:prefill] "
                              f"reqs={int(d['ttft_n'])} "
                              f"ttft_avg={d['ttft_s']/n:.2f}s "
                              f"prefill_avg={d['pre_s']/npre:.3f}s "
                              f"ext_hit_pct={100*d['hit']/q:.1f}", flush=True)
                        results.append({"tag": tag, **d})

                    # Post-eviction equivalence probe: the KA len32768 prompt
                    # (token 89) was computed cold during the known-answer
                    # phase and its HBM blocks are long evicted by the doc
                    # churn above. Re-issuing the identical greedy request
                    # must reproduce the cold token_ids — via CPU restore in
                    # the offloading leg, via recompute in the baseline leg.
                    cold_ids = None
                    try:
                        with open(f"{OUT}/smoke_ka_len32768-cold.json") as f:
                            cold_ids = json.load(f)["choices"][0].get(
                                "token_ids")
                    except Exception as exc:
                        print(f"[offload-tier] revisit-equivalence SKIP "
                              f"(no KA cold record: {exc})", flush=True)
                    if cold_ids:
                        payload = {
                            "model": MODEL,
                            "prompt": [89] * PREFIX,
                            "max_tokens": 8,
                            "temperature": 0.0,
                            "seed": 0,
                            "ignore_eos": True,
                            "add_special_tokens": False,
                            "return_token_ids": True,
                        }
                        req = urllib.request.Request(
                            PREFILL + "/v1/completions",
                            data=json.dumps(payload).encode(),
                            headers={"Content-Type": "application/json"})
                        try:
                            t0 = time.time()
                            with urllib.request.urlopen(req,
                                                        timeout=900) as r:
                                body = json.load(r)
                            dt = time.time() - t0
                            ids = body["choices"][0].get("token_ids")
                            ok = ids == cold_ids
                            if not ok:
                                errors += 1
                            print(f"[offload-tier] revisit-equivalence "
                                  f"{'PASS' if ok else 'FAIL'} e2e={dt:.2f}s "
                                  f"cold={cold_ids} revisit={ids}",
                                  flush=True)
                            requests_log.append({"visit": "ka-revisit",
                                                 "doc": -1, "e2e_s": dt,
                                                 "token_ids": ids,
                                                 "equal_to_cold": ok})
                        except Exception as exc:
                            errors += 1
                            print(f"[offload-tier] revisit-equivalence "
                                  f"ERROR: {exc}", flush=True)

                    # requests[] is cross-leg comparable: both recipes issue
                    # identical deterministic prompts, so token_ids here must
                    # match the other leg's offload_tier.json exactly.
                    with open(f"{OUT}/offload_tier.json", "w") as f:
                        json.dump({"passes": results,
                                   "requests": requests_log}, f, indent=2)
                    print(f"OFFLOAD-TIER COMPLETE (errors={errors})",
                          flush=True)
                    raise SystemExit(1 if errors else 0)
                    EOF

                    echo "===== Offload-tier long-prefix benchmark ====="
                    python3 /tmp/bench_offload_tier.py 2>&1 \
                      | tee "$CDK_OUTPUT_DIR/offload_tier.log" || fail=1

                    echo "===== GSM8K single-pass performance benchmark ====="
                    cat << 'EOF' | sed 's/^[[:space:]]\{20\}//' > /tmp/bench_gsm8k.py
                    import json
                    import os
                    import re
                    import subprocess
                    import time
                    import urllib.request

                    PORT = os.environ.get("PROXY_PORT", "10000")
                    JS = os.environ["JS_NAME"]
                    BASE = f"http://{JS}-prefill-0-0.{JS}:{PORT}"
                    METRICS_BASES = {
                        "prefill": f"http://{JS}-prefill-0-0.{JS}:8000",
                        "decode": f"http://{JS}-decode-0-0.{JS}:7200",
                    }
                    OUT = os.environ["CDK_OUTPUT_DIR"]
                    LIMIT = os.environ.get("SCORED_LIMIT", "300")
                    CONC = os.environ.get("BENCH_CONCURRENCY", "50")

                    def metrics():
                        snapshots = {}
                        for role, base in METRICS_BASES.items():
                            with urllib.request.urlopen(f"{base}/metrics", timeout=30) as r:
                                snapshots[role] = r.read().decode()
                        return snapshots

                    def dump(name, snapshots):
                        for role, text in snapshots.items():
                            with open(f"{OUT}/metrics_{role}_{name}.txt", "w") as f:
                                f.write(text)

                    def parse(text):
                        m = {}
                        for line in text.splitlines():
                            if line.startswith("#"):
                                continue
                            mo = re.match(r"vllm:([a-z_0-9]+)\{.*\} ([0-9.e+-]+)$", line)
                            if mo:
                                m[mo.group(1)] = m.get(mo.group(1), 0.0) + float(mo.group(2))
                        return m

                    def lm_eval(tag, limit):
                        cmd = [
                            "lm_eval", "--model", "local-completions", "--model_args",
                            f"base_url={BASE}/v1/completions,model={os.environ['MODEL']},"
                            f"tokenizer={os.environ['TOKENIZER']},"
                            # lm_eval's default per-request timeout is 300s; at
                            # concurrency 50 this pair's worst-case TTFT measured
                            # 290.8s, i.e. 9s of margin. A client
                            # that times out after the prefill engine published
                            # its KV orphans that send and pins producer blocks,
                            # so wait rather than abandon.
                            f"max_retries=10,max_length=8192,"
                            f"timeout={os.environ.get('LM_EVAL_TIMEOUT', '1800')},"
                            f"num_concurrent={CONC}",
                            "--tasks", "gsm8k",
                            "--num_fewshot", os.environ.get("FEWSHOT", "5"),
                            "--limit", str(limit),
                            "--seed", "1234,1234,1234,1234",
                            "--output_path", f"{OUT}/lm_eval_{tag}",
                        ]
                        t0 = time.time()
                        subprocess.run(cmd, check=True)
                        return time.time() - t0

                    K = dict(ttft_s="time_to_first_token_seconds_sum",
                             ttft_n="time_to_first_token_seconds_count",
                             e2e_s="e2e_request_latency_seconds_sum",
                             e2e_n="e2e_request_latency_seconds_count",
                             pre_s="request_prefill_time_seconds_sum",
                             pre_n="request_prefill_time_seconds_count",
                             ptok="prompt_tokens_total",
                             gtok="generation_tokens_total",
                             hit="external_prefix_cache_hits_total",
                             q="external_prefix_cache_queries_total")

                    def report(tag, wall, before, after):
                        result = {"tag": tag, "wall": wall}
                        for role in METRICS_BASES:
                            a, b = parse(after[role]), parse(before[role])
                            d = {k: a.get(v, 0) - b.get(v, 0) for k, v in K.items()}
                            n = d["ttft_n"] or 1
                            ne = d["e2e_n"] or 1
                            npre = d["pre_n"] or 1
                            q = d["q"] or 1
                            print(
                                f"[bench:{tag}:{role}] wall={wall:.1f}s reqs={int(d['e2e_n'])} "
                                f"ttft_avg={d['ttft_s']/n:.2f}s "
                                f"prefill_avg={d['pre_s']/npre:.3f}s "
                                f"e2e_avg={d['e2e_s']/ne:.1f}s "
                                f"prompt_tok={int(d['ptok'])} gen_tok={int(d['gtok'])} "
                                f"gen_tok_per_s={d['gtok']/wall:.1f} "
                                f"total_tok_per_s={(d['ptok']+d['gtok'])/wall:.1f} "
                                f"ext_hit_pct={100*d['hit']/q:.1f}",
                                flush=True)
                            result[role] = d
                        return result

                    results = []
                    snap = metrics()
                    dump("startup", snap)

                    print("[*] warmup (untimed, limit 16)...", flush=True)
                    lm_eval("warmup", 16)
                    snap = metrics()
                    dump("post_warmup", snap)

                    # One scored pass. The old fill/measure1/measure2 replay
                    # proved only that replays change nothing here (prefill
                    # offload hits are impossible for gsm8k prompts at this
                    # topology's 32768-token granularity); the offload-tier
                    # phase above is the cache-hit A/B. This single pass
                    # provides the TTFT/throughput parity numbers and a scored
                    # accuracy (correctness) signal in one shot.
                    for tag in ("measure",):
                        print(f"[*] {tag}: limit={LIMIT} concurrency={CONC}", flush=True)
                        before = snap
                        wall = lm_eval(tag, LIMIT)
                        snap = metrics()
                        dump(f"post_{tag}", snap)
                        results.append(report(tag, wall, before, snap))

                    with open(f"{OUT}/bench.json", "w") as f:
                        json.dump(results, f, indent=2)
                    print("BENCH COMPLETE", flush=True)
                    EOF

                    python3 /tmp/bench_gsm8k.py 2>&1 | tee "$CDK_OUTPUT_DIR/bench.log"

                    python3 - "$CDK_OUTPUT_DIR/bench.json" <<'PY'
                    import json
                    import sys

                    with open(sys.argv[1]) as f:
                        results = json.load(f)

                    tags = [r["tag"] for r in results]
                    if tags != ["measure"]:
                        raise SystemExit(f"unexpected passes: {tags}")
                    for r in results:
                        for role in ("prefill", "decode"):
                            if int(r[role]["e2e_n"]) <= 0:
                                raise SystemExit(
                                    f"pass {r['tag']} role {role}: no completed requests")
                            print(
                                f"pass {r['tag']} role {role}: "
                                f"reqs={int(r[role]['e2e_n'])} ok")
                    PY

                    if [ "$fail" -ne 0 ]; then
                      echo "RESULT: FAIL (one or more phases failed; see CORRECTNESS/OFFLOAD-TIER lines above)"
                      exit 1
                    fi
                    echo "RESULT: PASS"
                env:
                - name: JS_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
                - name: MODEL
                  value: "Qwen3.5-35B-A3B-FP8"
                # lm_eval reuses `model` as the HF tokenizer repo id, but the
                # servers are launched with --served-model-name, so the bare
                # name is not resolvable on the Hub. Pass the real repo id.
                - name: TOKENIZER
                  value: "Qwen/Qwen3.5-35B-A3B-FP8"
                - name: PROXY_PORT
                  value: "10000"
                # Long-prefix docs; 4 docs (~36 blocks) is >2x the 16-block
                # prefill pool, guaranteeing eviction between visits.
                - name: OFFLOAD_DOCS
                  value: "4"
                # 25-shot pushes gsm8k prompts to ~4.6k tokens — past one
                # 4096-token decode block, so Stage-3 transfers (and, in the
                # offload leg, decode-side D2H saves) see full-block traffic.
                # gsm8k is the accuracy + throughput-parity signal, not an
                # offload-hit workload (prefill offload granularity is 32768).
                - name: FEWSHOT
                  value: "25"
                - name: SCORED_LIMIT
                  value: "150"
                # Saturates the 2-seq prefill admission so gen_tok_per_s is a
                # clean throughput-parity signal. Server-side TTFT at this
                # queue depth is queue-dominated: compare throughput and
                # accuracy across legs, not ttft_avg.
                - name: BENCH_CONCURRENCY
                  value: "50"
                - name: LM_EVAL_TIMEOUT
                  value: "1800"
                resources:
                  limits:
                    memory: "16Gi"
                    cpu: "4"
                  requests:
                    memory: "8Gi"
                    cpu: "2"
